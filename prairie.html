<script type="module">
import * as THREE from 'three';

/* =========================================================
   PRAIRIE DES CLOCHES — circuit 100 % voxel (cubes uniquement)
   Cahier des charges : Prairie_voxel.xlsx
   1. Configuration (feuille 07_Physique)
   2. Scène, caméra, lumières, ciel (D24)
   3. Outil voxel : un InstancedMesh par couleur (règle S10)
   4. Le circuit : points de contrôle -> spline -> dalles de terre
   5. Le sol : prairie 220×220 m en blocs d'herbe + brins (D03/D04)
   6. Les clôtures (D05, collision F06)
   7. Le décor : ferme, silo, grange, moulin, rivière, arbres...
   8. Les acteurs : vaches, galeries, rampe bleue, rampe orange
   9. La voiture (pickup + creeper + poules, modèle conservé, S09)
  10. La conduite (physique du kart)
  11. Tours, chrono, HUD, boucle de jeu
   ========================================================= */

/* ---------- 1. CONFIGURATION ---------- */
const CONFIG = {
  vMaxTerre: 32, accel1: 18, seuilAccel: 20, accel2: 8, // 07 : accel 18 m/s² puis 8 au-delà de 20 m/s
  vMaxHerbe: 13.4, accelHerbe: 0.55,                     // 0,42 × 32, accélération ×0,55
  vMaxArriere: 8, frein: 26,
  gardeAuSol: 0.35, gravite: 20,
  yawLent: 90 * Math.PI / 180, yawRapide: 55 * Math.PI / 180, seuilYaw: 8, lissage: 0.12,
  clotureV: 0.72, clotureImpulsion: 4, clotureImmunite: 0.35, kartRayon: 0.9,
  vacheTerreV: 0.35, vacheHerbeV: 0.8, spinDuree: 0.6, spinTours: 1, poussVache: 1.5,
  rampeBleueVy: 9, gVol: 0.65, dureeVol: 1.3, boostBleu: 1.35, boostBleuDuree: 1.2,
  rampeOrangeVy: 7, boostOrange: 1.8, boostOrangeDuree: 1.1, rearm: 0.3,
  tasV: 0.6, tasDuree: 0.45, galerieCycle: 6.3, // repos 3 s + creuse 2,5 s + surgit 0,8 s
  toursMax: 3, antiRebond: 2, respawnDelai: 0.2, respawnV: 10,
};
const PAS = 0.25; // pas de la grille verticale (tout Y est un multiple de 0,25)

/* ---------- 2. SCÈNE, CAMÉRA, LUMIÈRES, CIEL ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6EC6F5); // ciel #6EC6F5
scene.fog = new THREE.Fog(0xD8F0C8, 120, 330); // horizon #D8F0C8

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const soleil = new THREE.DirectionalLight(0xFFF3E0, 2.0); // "soleil" = lumière directionnelle seule
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, far: 400 });
scene.add(soleil, soleil.target);
scene.add(new THREE.AmbientLight(0xBFD9FF, 0.55));

// D24 : 6 nuages = amas de 5 à 9 cubes blancs de 2 m
const nuages = [];
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
  for (let n = 0; n < 6; n++) {
    const g = new THREE.Group();
    const nb = 5 + (n % 5);
    for (let i = 0; i < nb; i++) {
      const c = new THREE.Mesh(geoCubeTmp(), mat);
      c.scale.set(2 + Math.random() * 4, 2, 2 + Math.random() * 2);
      c.position.set((Math.random() - .5) * 14, (Math.random() - .5) * 2, (Math.random() - .5) * 8);
      g.add(c);
    }
    g.position.set((Math.random() - .5) * 320, 44 + Math.random() * 8, (Math.random() - .5) * 320);
    scene.add(g); nuages.push(g);
  }
}
function geoCubeTmp() { return new THREE.BoxGeometry(1, 1, 1); }

/* ---------- 3. OUTIL VOXEL ----------
   S10 : PAS un mesh par bloc. V() empile une matrice dans un "seau"
   par couleur ; construireSeaux() crée un seul InstancedMesh par couleur.
   Tout est en cubes axis-alignés, sommets sur la grille de 0,25 m. */
const geoCube = new THREE.BoxGeometry(1, 1, 1);
const seaux = new Map(); // couleur -> matrices
function V(l, h, p, couleur, x, y, z, rotY = 0) {
  let liste = seaux.get(couleur);
  if (!liste) { liste = []; seaux.set(couleur, liste); }
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rotY, 0)),
    new THREE.Vector3(l, h, p));
  liste.push(m);
}
function construireSeaux() {
  for (const [couleur, matrices] of seaux) {
    const im = new THREE.InstancedMesh(geoCube, new THREE.MeshLambertMaterial({ color: couleur }), matrices.length);
    matrices.forEach((m, i) => im.setMatrixAt(i, m));
    im.instanceMatrix.needsUpdate = true;
    im.receiveShadow = true;
    scene.add(im);
  }
  seaux.clear();
}
// maillage individuel pour les objets animés (vaches, kart, ailes du moulin)
const cacheMat = new Map();
function matériauPour(couleur) {
  if (!cacheMat.has(couleur)) cacheMat.set(couleur, new THREE.MeshLambertMaterial({ color: couleur }));
  return cacheMat.get(couleur);
}
function bloc(l, h, p, couleur, x, y, z) {
  const mesh = new THREE.Mesh(geoCube, matériauPour(couleur));
  mesh.scale.set(l, h, p);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
// pseudo-aléa déterministe (même monde à chaque partie)
function prand(i, k) { const h = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return h - Math.floor(h); }

/* ---------- 4. LE CIRCUIT : points de contrôle -> spline -> dalles ----------
   Feuille 04. Origine = centre de la ligne de départ (P01), sens de course = +Z.
   Y déjà quantifié au pas de 0,25 m. Largeur en dalles de 1 m par point. */
const POINTS = [
  [0, 0, 0], [0, 0.25, 25], [1, 0.25, 50], [6, 0.5, 70],
  [18, 1, 100], [40, 1.5, 130], [70, 2.25, 150], [100, 3, 155], [125, 3.25, 140],
  [145, 2.5, 115], [155, 1.75, 85], [150, 1, 55],
  [130, 0.75, 30], [100, 0.75, 15], [70, 1, 30], [50, 0.75, 60], [45, 0.5, 95], [60, 0.5, 125],
  [85, 0.75, 145], [110, 2.75, 155], [130, 1.5, 140],
  [145, 1.25, 115], [150, 1.25, 85], [140, 1, 55], [115, 1, 35],
  [90, 1, 15], [65, 2.5, 5], [40, 1.75, 10], [20, 1.5, 30], [5, 1.25, 55], [-5, 0.75, 80],
  [-12, 0.5, 55], [-10, 0.25, 30], [-4, 0.25, 12],
];
const LARGEURS = [18,18,18,18, 16,16,16,16,16, 16,16,16, 18,18,18,18,18,18, 16,16,16, 16,16,16,16, 16,16,16,16,16, 18,18,18,18];

const courbe = new THREE.CatmullRomCurve3(
  POINTS.map(([x, y, z]) => new THREE.Vector3(x, y, z)), true, 'catmullrom', 0.5);

// Échantillonnage tous les 1 m ; Y quantifié au pas de 0,25 (F01/F03).
// Largeur : transition linéaire sur 12 m avant chaque point de contrôle (F02).
const echantillons = []; // {x,z,y,tx,tz,nx,nz,demi,s}
let LONGUEUR = 0;
{
  LONGUEUR = courbe.getLength();
  const N = Math.round(LONGUEUR); // ~993 échantillons
  const sCtrl = [0];
  for (let i = 1; i < POINTS.length; i++)
    sCtrl.push(sCtrl[i - 1] + Math.hypot(POINTS[i][0] - POINTS[i-1][0], POINTS[i][2] - POINTS[i-1][2]));
  const perimCtrl = sCtrl[sCtrl.length - 1] +
    Math.hypot(POINTS[0][0] - POINTS[POINTS.length-1][0], POINTS[0][2] - POINTS[POINTS.length-1][2]);
  for (let i = 0; i < N; i++) {
    const t = i / N;
    const p = courbe.getPointAt(t);
    const tan = courbe.getTangentAt(t);
    let j = 0;
    while (j < POINTS.length - 1 && sCtrl[j + 1] <= t * LONGUEUR + 1e-6) j++;
    const sProchain = (j + 1 < POINTS.length) ? sCtrl[j + 1] : perimCtrl;
    const reste = sProchain - t * LONGUEUR;
    let w;
    if (reste < 12 && reste >= 0) {
      const wA = LARGEURS[j], wB = LARGEURS[(j + 1) % POINTS.length];
      w = 2 * Math.round((wA + (wB - wA) * (1 - reste / 12)) / 2); // nombre pair de dalles
    } else w = LARGEURS[j];
    echantillons.push({
      x: p.x, z: p.z, y: Math.round(p.y / PAS) * PAS, s: t * LONGUEUR,
      tx: tan.x, tz: tan.z, nx: -tan.z, nz: tan.x, demi: w / 2,
    });
  }
}
const NB = echantillons.length;
// distance (m) le long de la piste du point de contrôle d'indice i
function sOfIndex(i) { return echantillons[Math.floor(i * NB / POINTS.length)].s; }

// Pose des dalles (D01 : 3 ocres, ornières en filets discontinus) + bas-côtés (D02)
const TERRE_CENTRE = 0xC4A15A, TERRE_CLAIR = 0xD4B56A, ORNIERE = 0xA8843E, TERRE_FOND = 0x6B4A2A;
const cellulesPiste = new Set(); // cases de sol recouvertes par la piste (évite le z-fighting)
for (let i = 0; i < NB; i++) {
  const e = echantillons[i];
  const yaw = Math.atan2(e.tx, e.tz);
  for (let k = -e.demi; k < e.demi; k++) {
    const r = prand(i, k);
    let couleur = TERRE_CENTRE;
    if (r > 0.8) couleur = TERRE_CLAIR;
    else if (r < 0.1) couleur = ORNIERE;
    else if (Math.abs(k) >= e.demi - 1 && prand(i, k + 99) > 0.4) couleur = ORNIERE;
    V(1, 0.25, 1, couleur, e.x + e.nx * (k + 0.5), e.y - 0.125, e.z + e.nz * (k + 0.5), yaw);
    cellulesPiste.add(Math.floor(e.x + e.nx * (k + 0.5)) + ',' + Math.floor(e.z + e.nz * (k + 0.5)));
  }
  // D02 : une dalle terre de plus de chaque côté = surface Terre, pas herbe
  for (const cote of [1, -1]) {
    V(1, 0.25, 1, ORNIERE, e.x + cote * e.nx * (e.demi + 0.5), e.y - 0.125, e.z + cote * e.nz * (e.demi + 0.5), yaw);
    cellulesPiste.add(Math.floor(e.x + cote * e.nx * (e.demi + 0.5)) + ',' + Math.floor(e.z + cote * e.nz * (e.demi + 0.5)));
  }
  // remplissage en terre sous la piste surélevée (pas de vide sous les dalles)
  if (e.y > 0.25) V(e.demi * 2 + 2, e.y - 0.25, 1, TERRE_FOND, e.x, (e.y - 0.25) / 2, e.z, yaw);
}

/* ---------- 5. LE SOL : prairie 220 × 220 m en blocs d'herbe (D03/D04) ---------- */
const VERTS = [0x3E8F3A, 0x2F7A34, 0x67A84A], TRANCHE = 0x6B4A2A, VERT_LOIN = 0x245C2A;
{
  const M = 110; // demi-monde
  for (let gx = -M; gx < M; gx++) for (let gz = -M; gz < M; gz++) {
    if (cellulesPiste.has(gx + ',' + gz)) continue; // la piste est posée SUR le sol
    const loin = Math.max(Math.abs(gx), Math.abs(gz)) > 85;
    const vert = loin ? VERT_LOIN : VERTS[Math.floor(prand(gx, gz) * 3)];
    V(1, 0.25, 1, TRANCHE, gx + 0.5, -0.125, gz + 0.5); // tranche terre
    V(1, 0.03, 1, vert, gx + 0.5, -0.005, gz + 0.5);     // dessus vert
    // brins = colonnes de 1 à 3 cubes de 0,25 m (visuels, sans hitbox)
    const p = prand(gz, gx);
    if (!loin && p < 0.5) { // pleine densité près de la piste (~1 bloc sur 2)
      const nb = 1 + Math.floor(prand(gx, gz + 7) * 3);
      for (let b = 0; b < nb; b++)
        V(0.25, 0.25, 0.25, VERTS[(b + Math.floor(prand(gx + 3, gz))) % 3], gx + 0.5, 0.125 + b * 0.25, gz + 0.5);
    } else if (loin && p < 0.25) {
      V(0.25, 0.25, 0.25, VERT_LOIN, gx + 0.5, 0.125, gz + 0.5);
    }
  }
}

/* ---------- 6. LES CLÔTURES (D05 + collision F06) ----------
   Module de 2 m : 2 poteaux (haut 1 m) + 2 lisses, à 1,2 m hors bas-côté.
   Portail visuel de 4 m en S3 (lisses absentes, collision gardée).
   S2 : trou de 40 m sans clôture côté ferme. Collision = segments. */
const BOIS_A = 0x8B5A2B, BOIS_B = 0x6E4520;
const segmentsCloture = []; // {x1,z1,x2,z2} pour la collision du kart
{
  const sP05 = sOfIndex(4), sP09 = sOfIndex(8);   // section S2
  const sP11 = sOfIndex(10);                      // portail au milieu de S3
  for (let i = 0; i < NB; i += 2) {
    const e = echantillons[i], e2 = echantillons[(i + 2) % NB];
    const yaw = Math.atan2(e.tx, e.tz);
    const portail = e.s > sP11 - 2 && e.s < sP11 + 2; // 4 m sans lisses
    for (const cote of [1, -1]) {
      const d = e.demi + 1 + 1.2;
      const px = e.x + cote * e.nx * d, pz = e.z + cote * e.nz * d;
      const qx = e2.x + cote * e2.nx * d, qz = e2.z + cote * e2.nz * d;
      const bois = ((i / 2) % 2 === 0) ? BOIS_A : BOIS_B;
      const trouFerme = cote > 0 && e.s > sP05 + 10 && e.s < sP05 + 50; // S2, bord ferme
      if (!trouFerme) {
        segmentsCloture.push({ x1: px, z1: pz, x2: qx, z2: qz });
        const haut = portail ? 1.5 : 1.0; // poteaux plus hauts au portail
        V(0.25, haut, 0.25, bois, px, e.y + haut / 2, pz);
        V(0.25, haut, 0.25, bois, qx, e2.y + haut / 2, qz);
        if (!portail) {
          const lx = (px + qx) / 2, lz = (pz + qz) / 2;
          const L = Math.hypot(qx - px, qz - pz);
          for (const ly of [0.5, 0.75]) V(L, 0.25, 0.25, bois, lx, Math.max(e.y, e2.y) + ly, lz, -yaw + Math.PI / 2);
        }
      }
    }
  }
  void sP09;
}

/* ---------- 7. LE DÉCOR VOXEL (feuille 05) ---------- */
function ech(iCtrl) { return echantillons[Math.min(NB - 1, Math.floor(iCtrl * NB / POINTS.length))]; }
function lat(e, d) { return { x: e.x + e.nx * d, z: e.z + e.nz * d }; }

// D06 ferme : volume 14×8×5 m en cubes de 1 m, toit en escalier vers le faîte
function poserFerme(cx, cz) {
  for (let ix = -7; ix < 7; ix++) for (let iz = -2; iz < 3; iz++)
    for (let iy = 0; iy < 5; iy++)
      V(1, 1, 1, 0xF4F1E6, cx + ix + 0.5, 0.5 + iy, cz + iz + 0.5);
  for (let e = 0; e < 3; e++) { // toit en escalier (deux pentes qui se rejoignent)
    const larg = 3 - e;
    for (let ix = -7; ix < 7; ix++) for (const iz of [-larg, larg - 1])
      V(1, 1, 1, 0xC0392B, cx + ix + 0.5, 5.5 + e, cz + iz + 0.5);
  }
  V(1, 1, 1, 0xC0392B, cx, 6.5, cz - 2.5); V(1, 1, 1, 0xC0392B, cx, 7.5, cz - 1.5); // faîte
  for (const sx of [-1, 1]) for (let iy = 0; iy < 2; iy++) for (let iz = 0; iz < 2; iz++) // porte 2×2 en retrait
    if (!(sx === 1 && iy === 0 && iz === 0)) V(0.9, 0.9, 0.2, 0x6B3E26, cx + sx * 6.6, 0.45 + iy, cz - 2 + iz);
  for (const [fx, fz] of [[-4, -2.6], [4, -2.6], [-4, 2.6], [4, 2.6]]) // fenêtres bleues
    V(1, 1, 0.2, 0x1F4E79, cx + fx, 3, cz + fz);
}
// D07 silo : colonne carrée 4×4×9 m, dernier mètre en créneaux, toit pyramidal
function poserSilo(cx, cz) {
  for (let ix = 0; ix < 4; ix++) for (let iz = 0; iz < 4; iz++) {
    const creneau = (ix === 0 || ix === 3) && (iz === 0 || iz === 3); // coins seulement
    for (let iy = 0; iy < 9; iy++) if (!(iy === 8 && !creneau))
      V(1, 1, 1, 0xD9D9D9, cx + ix, 0.5 + iy, cz + iz);
  }
  for (let iy = 0; iy < 5; iy++) V(1, 1, 1, 0x2E75B6, cx + 1.5, 4.5 + iy, cz + 1.5); // bande bleue (tranches)
  for (let e = 0; e < 3; e++) { const t = 4 - 2 * e; for (let ix = 0; ix < t; ix++) for (let iz = 0; iz < t; iz++)
    V(1, 1, 1, 0xB0B0B0, cx + ix + e * 0.5, 9.5 + e, cz + iz + e * 0.5); }
}
// D08 grange : boîte 10×6×4, toit en escalier raide rouge
function poserGrange(cx, cz) {
  for (let ix = -5; ix < 5; ix++) for (let iz = -2; iz < 2; iz++)
    for (let iy = 0; iy < 4; iy++) V(1, 1, 1, 0xA0673A, cx + ix + 0.5, 0.5 + iy, cz + iz + 0.5);
  for (let e = 0; e < 3; e++) for (let ix = -5; ix < 5; ix++) for (const iz of [-(2 - e), 1 + e])
    V(1, 1, 1, 0x922B21, cx + ix + 0.5, 4.5 + e, cz + iz + 0.5);
  V(2, 3, 0.3, 0x5E2F18, cx, 1.5, cz - 2.1); V(2, 3, 0.3, 0x5E2F18, cx, 1.5, cz + 2.1); // portes foncées
}
// D09 chariot à lait : caisse + 4 roues-cubes + 2 bidons
function poserChariot(cx, cz, yaw) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const L = (lx, lz) => [cx + lx * c - lz * s, cz + lx * s + lz * c];
  V(2, 1, 1, 0xE8D5A3, cx, 0.75, cz, yaw);
  for (const [rx, rz] of [[-0.75, -0.4], [0.75, -0.4], [-0.75, 0.4], [0.75, 0.4]]) {
    const [wx, wz] = L(rx, rz); V(0.5, 0.5, 0.5, 0x333333, wx, 0.25, wz);
  }
  for (const bz of [-0.25, 0.25]) { const [wx, wz] = L(0.6, bz); V(0.5, 1, 0.5, 0xD0D0D0, wx, 1.5, wz); }
}
{
  const e07 = ech(6); // ferme à droite de P07, centre à X+28 m
  poserFerme(e07.x + 28, e07.z);
  poserSilo(e07.x + 16, e07.z + 8);       // silo collé au côté piste de la ferme
  poserGrange(e07.x + 40, e07.z);         // grange derrière la ferme (+12 m en X)
  const e06 = ech(5); const p06 = lat(e06, e06.demi + 6);
  poserChariot(p06.x, p06.z, 0.3);        // chariot 6 m du bord de piste
}

// D19 rivière : ruban de blocs bleus 1×0,5×1, Y = sol − 0,5, 6 blocs de large, un coude
function poserRiviere(points) {
  for (let i = 0; i < points.length - 1; i++) {
    const [ax, az] = points[i], [bx, bz] = points[i + 1];
    const L = Math.hypot(bx - ax, bz - az), n = Math.ceil(L);
    const ux = (bx - ax) / L, uz = (bz - az) / L, nx = -uz, nz = ux;
    for (let k = 0; k <= n; k++) for (let w = -3; w < 3; w++) {

  poule.add(bloc(0.1, 0.28, 0.1, 0xF57C00, 0.2, 0.14, 0.1));
  poule.scale.setScalar(0.8);
  poule.position.set(x, 0.72, z);
  pickup.add(poule);
}
creerPoule(0xB5651D, 0x8D4E16, -0.38, 1.35);
creerPoule(0x263238, 0x1B2328, 0.38, 1.5);

/* ---------- 10. LA CONDUITE (physique du kart, feuille 07) ---------- */
function plusProche(x, z) {
  let best = -1, bd = Infinity, bo = 0;
  for (let i = 0; i < NB; i++) {
    const e = echantillons[i];
    const dx = e.x - x, dz = e.z - z, d2 = dx * dx + dz * dz;
    if (d2 < bd) { bd = d2; best = i; bo = dx * e.nx + dz * e.nz; }
  }
  return { i: best, e: echantillons[best], d: bo, dist: Math.sqrt(bd) };
}
function dansRampe(r, x, z) {
  const dx = x - r.x, dz = z - r.z;
  const along = dx * Math.sin(r.yaw) + dz * Math.cos(r.yaw);
  const lat = dx * Math.cos(r.yaw) - dz * Math.sin(r.yaw);
  return along > -0.5 && along < r.long + 0.5 && Math.abs(lat) < r.larg / 2 ? along : -1;
}
function surface(x, z) {
  const aB = dansRampe(rampeBleue, x, z);
  if (aB >= 0) return { type: 'terre', y: rampeBleue.y0 + (rampeBleue.h / rampeBleue.long) * aB, rampe: 'bleue' };
  const aO = dansRampe(rampeOrange, x, z);
  if (aO >= 0) return { type: 'terre', y: (rampeOrange.h / rampeOrange.long) * aO, rampe: 'orange' };
  const p = plusProche(x, z);
  if (p.dist < 25 && Math.abs(p.d) <= p.e.demi + 1) return { type: 'terre', y: p.e.y };
  return { type: 'herbe', y: hauteurColline(x, z) };
}

const voiture = {
  x: 0, z: 0, y: 0, cap: Math.PI, v: 0, vy: 0,
  air: null, spin: 0, boostT: 0, boostMult: 1, ralentiT: 0,
  immunite: 0, perduT: 0, idxPrev: 0, tour: 0, antiRebond: 0,
  steer: 0, chrono: 0, demarre: false, fini: false, tP12: -1,
};
voiture.y = surface(0, 0).y + CONFIG.gardeAuSol;

const touches = {};
addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  touches[e.code] = true;
  if (e.code === 'KeyR') respawn();
});
addEventListener('keyup', e => { touches[e.code] = false; });

function respawn() {
  const p = plusProche(voiture.x, voiture.z);
  voiture.x = p.e.x; voiture.z = p.e.z;
  voiture.y = p.e.y + CONFIG.gardeAuSol;
  voiture.cap = Math.atan2(-p.e.tx, -p.e.tz);
  voiture.v = CONFIG.respawnV; voiture.vy = 0; voiture.air = null; voiture.spin = 0;
  voiture.perduT = 0;
}

function majVaches(dt, temps) {
  for (const c of vaches) {
    c.cool = Math.max(0, c.cool - dt);
    if (voiture.tour >= 1 && c.etat === 'paturage' && c.groupe === 'A' && voiture.tP12 > 0 && temps > voiture.tP12 + 8) {
      c.etat = 'traversee'; c.t0 = temps;
    } else if (voiture.tour >= 1 && c.etat === 'paturage' && c.groupe === 'B' && voiture.tP12 > 0 && temps > voiture.tP12 + 12) {
      c.etat = 'traversee'; c.t0 = temps;
    }
    if (c.etat === 'traversee') {
      const t = temps - c.t0, cote = c.groupe === 'A' ? 1 : -1;
      const e = plusProche(c.x0, c.z0).e;
      const av = Math.min(t * 1.2, (e.demi + 10) * 2); // traversée perpendiculaire à 1,2 m/s
      c.x = c.x0 - cote * e.nx * av; c.z = c.z0 - cote * e.nz * av;
      if (t > 12) { c.etat = 'retour'; c.t0 = temps; }
    } else if (c.etat === 'retour') {
      const t = temps - c.t0, cote = c.groupe === 'A' ? 1 : -1;
      const e = plusProche(c.x0, c.z0).e;
      const av = Math.max(0, (e.demi + 10) * 2 - t * 1.2);
      c.x = c.x0 - cote * e.nx * av; c.z = c.z0 - cote * e.nz * av;
      if (t > 12) c.etat = 'paturage';
    } else {
      // pâture : petite marche au hasard
      c.capMarche += (Math.random() - 0.5) * dt * 2;
      c.x = c.x0 + Math.cos(c.capMarche) * 1.5;
      c.z = c.z0 + Math.sin(c.capMarche) * 1.5;
    }
    c.mesh.position.set(c.x, surface(c.x, c.z).y, c.z);
    c.mesh.rotation.y += dt * (c.etat === 'paturage' ? 0.5 : 2);
  }
}

function majGaleries(dt, temps) {
  for (const g of galeries) {
    g.cool = Math.max(0, g.cool - dt);
    const t = (temps + g.phase) % CONFIG.galerieCycle;
    g.etat = t < 3 ? 'repos' : (t < 5.5 ? 'creuse' : 'surgit');
    g.tas.visible = g.etat === 'creuse';
    const h = g.etat === 'surgit' ? Math.min(0.75, (t - 5.5) / 0.15 * 0.75) : 0; // monte par translation, pas de scale
    g.tete.position.y = g.y - 0.75 + h;
    g.tete.visible = g.etat === 'surgit';
    // collisions seulement quand les cubes sont visibles (jamais d'effet fantôme)
    const d = Math.hypot(voiture.x - g.x, voiture.z - g.z);
    if (g.cool <= 0 && !voiture.air) {
      if (g.etat === 'creuse' && d < 1.3) { voiture.v *= CONFIG.tasV; voiture.ralentiT = CONFIG.tasDuree; g.cool = 0.6; }
      if (g.etat === 'surgit' && d < 1.2) { voiture.spin = CONFIG.spinDuree; voiture.v *= CONFIG.vacheTerreV; g.cool = 0.6; }
    }
  }
}

function distSegment(px, pz, s) {
  const dx = s.x2 - s.x1, dz = s.z2 - s.z1;
  const L2 = dx * dx + dz * dz;
  let t = L2 > 0 ? ((px - s.x1) * dx + (pz - s.z1) * dz) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = s.x1 + t * dx, cz = s.z1 + t * dz;
  return { d: Math.hypot(px - cx, pz - cz), nx: (px - cx), nz: (pz - cz) };
}

function update(dt, temps) {
  if (voiture.fini) dt = 0;
  const p = plusProche(voiture.x, voiture.z);
  // --- ligne de tour (P01) : sens +Z, anti-rebond 2 s ---
  if (voiture.idxPrev > NB - 20 && p.i < 20 && voiture.v > 1 && voiture.antiRebond <= 0) {
    voiture.tour++; voiture.antiRebond = CONFIG.antiRebond;
    if (voiture.tour >= CONFIG.toursMax) finirCourse();
  }
  voiture.idxPrev = p.i;
  voiture.antiRebond = Math.max(0, voiture.antiRebond - dt);
  if (p.i > sOfIndex(11) - 5 && p.i < sOfIndex(11) + 5 && voiture.tP12 < 0) voiture.tP12 = temps;

  // --- direction (F12) : lacet max 90°/s à l'arrêt, 55°/s à fond, lissage 0,12 s ---
  const target = (touches.ArrowLeft ? 1 : 0) - (touches.ArrowRight ? 1 : 0);
  voiture.steer += (target - voiture.steer) * Math.min(1, dt / CONFIG.lissage);
  const yawRate = CONFIG.yawLent + (CONFIG.yawRapide - CONFIG.yawLent) * Math.min(1, Math.abs(voiture.v) / CONFIG.vMaxTerre);
  voiture.cap += voiture.steer * yawRate * (voiture.v >= 0 ? 1 : -1) * dt;
  if (voiture.spin > 0) { // toupie : le châssis pivote de 360° en 0,6 s, la trajectoire continue
    voiture.spin -= dt;
    voiture.cap += (CONFIG.spinTours * Math.PI * 2 / CONFIG.spinDuree) * dt;
  }

  // --- surface sous le kart (F05 : terre = pleine vitesse, herbe = ×0,42 / accel ×0,55) ---
  const sol = surface(voiture.x, voiture.z);
  const herbe = sol.type === 'herbe';

  // --- rampe bleue (F08) / orange (F10) : déclenchement sur toute la largeur ---
  if (!voiture.air && sol.rampe === 'bleue' && rampeBleue.rearm <= 0) {
    voiture.air = { t: 0, gScale: CONFIG.gVol, origine: 'bleue' };
    voiture.vy = CONFIG.rampeBleueVy;
    rampeBleue.rearm = CONFIG.rearm + CONFIG.dureeVol;
  } else if (!voiture.air && sol.rampe === 'orange' && rampeOrange.rearm <= 0) {
    voiture.air = { t: 0, gScale: 1, origine: 'orange' };
    voiture.vy = CONFIG.rampeOrangeVy;
    voiture.boostT = CONFIG.boostOrangeDuree; voiture.boostMult = CONFIG.boostOrange;
    rampeOrange.rearm = CONFIG.rearm;
  }
  rampeBleue.rearm = Math.max(0, rampeBleue.rearm - dt);
  rampeOrange.rearm = Math.max(0, rampeOrange.rearm - dt);

  // --- vol (gravité 20 m/s², ×0,65 pendant 1,3 s sur la bleue, boost ×1,35 à l'atterrissage) ---
  if (voiture.air) {
    voiture.air.t += dt;
    voiture.vy -= CONFIG.gravite * voiture.air.gScale * dt;
    voiture.y += voiture.vy * dt;
    const solY = sol.y + CONFIG.gardeAuSol;
    if (voiture.y <= solY && voiture.vy <= 0) {
      voiture.y = solY; voiture.vy = 0;
      if (voiture.air.origine === 'bleue') { voiture.boostT = CONFIG.boostBleuDuree; voiture.boostMult = CONFIG.boostBleu; }
      voiture.air = null;
    }
  } else {
    voiture.y = sol.y + CONFIG.gardeAuSol;
  }

  // --- accélération / frein ---
  const vMax = (herbe ? CONFIG.vMaxHerbe : CONFIG.vMaxTerre) * (voiture.boostT > 0 ? voiture.boostMult : 1);
  if (voiture.ralentiT > 0) { voiture.ralentiT -= dt; }
  const vMaxEff = voiture.ralentiT > 0 ? Math.min(vMax, CONFIG.vMaxTerre * CONFIG.tasV) : vMax;
  if (touches.ArrowUp) {
    const a = (voiture.v < CONFIG.seuilAccel ? CONFIG.accel1 : CONFIG.accel2) * (herbe ? CONFIG.accelHerbe : 1);
    voiture.v += a * dt;
    voiture.demarre = true;
  } else if (touches.ArrowDown) {
    voiture.v -= CONFIG.frein * dt;
  } else {
    voiture.v -= Math.sign(voiture.v) * Math.min(Math.abs(voiture.v), 6 * dt);
  }
  voiture.v = Math.max(-CONFIG.vMaxArriere, Math.min(vMaxEff, voiture.v));
  voiture.boostT = Math.max(0, voiture.boostT - dt);

  // --- déplacement ---
  const dirX = -Math.sin(voiture.cap), dirZ = -Math.cos(voiture.cap);
  voiture.x += dirX * voiture.v * dt;
  voiture.z += dirZ * voiture.v * dt;

  // --- clôtures (F06) : contact = vitesse ×0,72 + impulsion 4 m/s vers l'intérieur, immunité 0,35 s ---
  voiture.immunite = Math.max(0, voiture.immunite - dt);
  if (voiture.immunite <= 0) {
    for (const s of segmentsCloture) {
      const r = distSegment(voiture.x, voiture.z, s);
      if (r.d < CONFIG.kartRayon + 0.35) {
        const n = Math.max(r.d, 0.01);
        voiture.x += (r.nx / n) * (CONFIG.kartRayon + 0.35 - r.d); // jamais bloqué, pénétration max ~0,3 m
        voiture.z += (r.nz / n) * (CONFIG.kartRayon + 0.35 - r.d);
        voiture.v *= CONFIG.clotureV;
        voiture.x += (r.nx / n) * CONFIG.clotureImpulsion * dt * 4;
        voiture.z += (r.nz / n) * CONFIG.clotureImpulsion * dt * 4;
        voiture.immunite = CONFIG.clotureImmunite;
        break;
      }
    }
  }

  // --- vaches (F07) ---
  for (const c of vaches) {
    const d = Math.hypot(voiture.x - c.x, voiture.z - c.z);
    if (d < 1.7 && c.cool <= 0 && !voiture.air) {
      const surTerre = surface(c.x, c.z).type === 'terre';
      if (surTerre) { voiture.spin = CONFIG.spinDuree; voiture.v *= CONFIG.vacheTerreV; } // demi-tour 0,6 s
      else voiture.v *= CONFIG.vacheHerbeV;                                              // poussée, pas de toupie
      const n = Math.max(d, 0.01);
      c.x += (voiture.x - c.x) / n * CONFIG.poussVache;
      c.z += (voiture.z - c.z) / n * CONFIG.poussVache;
      c.cool = 1;
    }
  }

  // --- rayon perdu > 0,2 s : retour au centre de piste le plus proche (pas de mort) ---
  if (p.dist > 20) { voiture.perduT += dt; if (voiture.perduT > CONFIG.respawnDelai) respawn(); }
  else voiture.perduT = 0;

  majVaches(dt, temps);
  majGaleries(dt, temps);

  // --- rendu du kart : cap + inclinaison selon la pente (max 12°) ---
  const ahead = surface(voiture.x + dirX * 2, voiture.z + dirZ * 2);
  const pitch = Math.max(-12 * Math.PI / 180, Math.min(12 * Math.PI / 180, Math.atan2(ahead.y - sol.y, 2)));
  pickup.position.set(voiture.x, voiture.y, voiture.z);
  pickup.rotation.set(voiture.air ? pitch * 2 : pitch, voiture.cap, 0, 'YXZ');

  // --- caméra suiveuse + ombre du soleil recentrées sur le kart ---
  const camX = voiture.x - dirX * 9, camZ = voiture.z - dirZ * 9;
  camera.position.lerp(new THREE.Vector3(camX, voiture.y + 4.5, camZ), Math.min(1, dt * 6));
  camera.lookAt(voiture.x + dirX * 8, voiture.y + 1, voiture.z + dirZ * 8);
  soleil.position.set(voiture.x + 60, voiture.y + 90, voiture.z + 40);
  soleil.target.position.set(voiture.x, voiture.y, voiture.z);

  // --- chrono + HUD ---
  if (voiture.demarre && !voiture.fini) voiture.chrono += dt;
  const m = Math.floor(voiture.chrono / 60), s = Math.floor(voiture.chrono % 60);
  hud.textContent = `Tour ${Math.min(voiture.tour + 1, CONFIG.toursMax)}/${CONFIG.toursMax}  ⏱ ${m}:${String(s).padStart(2, '0')}  🚜 ${Math.round(Math.abs(voiture.v) * 3.6)} km/h`;
}

/* ---------- 11. BOUCLE DE JEU ---------- */
const hud = document.getElementById('hud');
const finEl = document.getElementById('fin');
function finirCourse() {
  voiture.fini = true;
  const m = Math.floor(voiture.chrono / 60), s = (voiture.chrono % 60).toFixed(1);
  document.getElementById('tempsFin').textContent = `Temps : ${m}:${String(Math.floor(s)).padStart(2, '0')}.${Math.floor((s % 1) * 10)}`;
  finEl.style.display = 'flex';
}
addEventListener('keydown', e => { if (e.code === 'KeyR' && voiture.fini) location.reload(); });

let dernier = performance.now();
function boucle(now) {
  const dt = Math.min(0.05, (now - dernier) / 1000);
  dernier = now;
  const temps = now / 1000;
  update(dt, temps);
  for (const n of nuages) { n.position.x += dt * 0.6; if (n.position.x > 200) n.position.x = -200; }
  moulin.ailes.rotation.y += (15 * Math.PI / 180) * dt; // 15°/s : seule rotation libre autorisée
  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
