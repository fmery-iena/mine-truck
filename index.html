<!-- Three.js via CDN : rien à installer, il faut juste internet -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   PICKUP MINECRAFT — PRAIRIE MEUH MEUH (circuit fermé)
   1. Scène, caméra, lumières
   2. Le circuit : une boucle fermée (spline) façon Mario
      Kart "Prairie Meuh Meuh" — virages en S, grandes
      courbes, ligne d'arrivée en damier
   3. Le décor : herbe, arbres, maisons et VACHES
   4. La voiture (pickup + creeper en armure d'or)
   5. La conduite : la voiture tourne vraiment, elle peut
      sortir de la piste (ralentit dans l'herbe)
   6. Diamants à ramasser + compteur de tours
   7. Klaxon canard
   ========================================================= */

/* ---------- 1. SCÈNE, CAMÉRA, LUMIÈRES ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // ciel bleu Minecraft
scene.fog = new THREE.Fog(0x87CEEB, 90, 190);  // brume au loin

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
// P4 : on limite la densité de pixels (sur écran Retina/4K, le rendu
// coûte 4x plus cher — 1.5 est un bon compromis netteté/perf)
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
// Ombres douces (PCFSoft) : surcoût maîtrisé par la zone
// resserrée de la shadow camera dans la lumière du soleil
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- SOLEIL VISIBLE + LUMIÈRE RÉALISTE ----------
   La lumière directionnelle est rehaussée (60, 90, 40)
   pour des ombres naturelles, avec une shadow map
   resserrée sur la zone de jeu (perf). Le soleil visible
   est une sphère + halo (fog: false pour rester net au
   loin). L'ambient légèrement bleuté donne un ciel « vivant »
   sans skybox coûteuse. */
const POSITION_SOLEIL = new THREE.Vector3(60, 90, 40);

const soleil = new THREE.DirectionalLight(0xFFF3E0, 2.2); // teinte chaude
soleil.position.copy(POSITION_SOLEIL);
soleil.castShadow = true;
// Zone couverte par les ombres : juste la piste et ses abords
soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.camera.left = -80;
soleil.shadow.camera.right = 80;
soleil.shadow.camera.top = 80;
soleil.shadow.camera.bottom = -80;
soleil.shadow.camera.near = 10;
soleil.shadow.camera.far = 300;
soleil.shadow.bias = -0.0005; // évite les artefacts de bord
scene.add(soleil);
scene.add(soleil.target); // cible au centre de la piste

scene.add(new THREE.AmbientLight(0xBFD9FF, 0.5)); // ambiance ciel

// Le soleil visible : sphère jaune + halo semi-transparent
const groupeSoleil = new THREE.Group();
groupeSoleil.position.copy(POSITION_SOLEIL).multiplyScalar(1.4);
const sphSoleil = new THREE.Mesh(
  new THREE.SphereGeometry(7, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xFFE082, fog: false })
);
groupeSoleil.add(sphSoleil);
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(9.5, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xFFF9C4, fog: false, transparent: true, opacity: 0.3 })
);
groupeSoleil.add(halo);
scene.add(groupeSoleil);

/* =========================================================
   2. LE CIRCUIT
   Le tracé est une boucle fermée : une liste de points de
   passage (comme Prairie Meuh Meuh : grande courbe, virage
   en S, épingle). On construit la route en posant des
   pavés le long de la courbe. Pour modifier le circuit,
   il suffit de changer les POINTS_CIRCUIT ci-dessous !
   ========================================================= */
const CONFIG = {
  largeurRoute: 10,
  vitesseMax: 0.55,
  vitesseHerbe: 0.22,   // vitesse max quand on est dans l'herbe
  acceleration: 0.012,
  freinage: 0.03,
  ralentissement: 0.004,
  vitesseVirage: 0.06, // vitesse de rotation du pickup
  vitesseLaterale: 0.22,
};

const HAUTEUR_ROUTE = 0.2;
const COULEUR_ROUTE = 0x3F3F46;
const COULEUR_LIGNE = 0xE0E0E0;
const COULEUR_ACCOT = 0x8F8770;

/* ---------- P2 : géométrie et matériaux PARTAGÉS ----------
   Avant, chaque bloc() créait sa propre BoxGeometry et son
   propre matériau → des milliers d'objets GPU distincts.
   Maintenant : UNE SEULE géométrie de cube unitaire (échelonnée
   par mesh.scale) et UN matériau par couleur (mis en cache).
   Résultat : bien moins de mémoire GPU et des draw calls
   regroupables par le moteur. */
const geoCube = new THREE.BoxGeometry(1, 1, 1); // LA géométrie partagée
const cacheMatériaux = new Map();

function matériauPour(couleur) {
  if (!cacheMatériaux.has(couleur)) {
    cacheMatériaux.set(couleur, new THREE.MeshLambertMaterial({ color: couleur }));
  }
  return cacheMatériaux.get(couleur);
}

function bloc(largeur, hauteur, profondeur, couleur, x, y, z) {
  const mesh = new THREE.Mesh(geoCube, matériauPour(couleur));
  mesh.scale.set(largeur, hauteur, profondeur); // on étire le cube unitaire
  mesh.position.set(x, y, z);
  return mesh;
}

/* --- Les points de passage du circuit (x, z) ---
   Une boucle inspirée de Prairie Meuh Meuh : grandes
   courbes larges, petits virages en S, retour en épingle
   douce. Pour créer un NOUVEAU circuit, il suffit de
   changer ces points ! */
const POINTS_CIRCUIT = [
  [47.6, 0], [48.1, 15.2], [41.5, 27.6], [30.7, 35.2],
  [19.2, 39.6], [8.9, 43.8], [0, 48.8], [-8.2, 52.3],
  [-16, 50.4], [-23, 41.5], [-29.2, 27.6], [-34.7, 12.9],
  [-39.6, 0], [-42.7, -11.7], [-41.5, -24.4], [-34.7, -38.3],
  [-23.2, -50.4], [-10.4, -56.7], [0, -55.2], [6.8, -48.1],
  [12, -39.6], [19, -32.1], [29.2, -24.4], [40.2, -14],
];
const courbe = new THREE.CatmullRomCurve3(
  POINTS_CIRCUIT.map(([x, z]) => new THREE.Vector3(x, 0, z)),
  true,   // fermé : la boucle revient au départ
  'catmullrom',
  0.5
);

/* =========================================================
   2bis. REGISTRE D'OBSTACLES (pour les collisions)
   Chaque obstacle solide enregistre sa position (x, z) et
   son rayon de collision (cercle, insensible à la rotation).
   Types : 'solide' = repousse la voiture, 'vache' = se fait
   pousser doucement (option A).
   ========================================================= */
const obstacles = [];

function enregistrerObstacle(x, z, rayon, type, mesh) {
  obstacles.push({ x, z, rayon, type, mesh });
}

/* --- On échantillonne la courbe pour connaître la piste --- */
// P3 : nombre de pavés de la route. 280 suffit largement (le pas
// entre deux pavés reste court), ça divise par ~2.5 le nombre de
// meshes par rapport aux 700 d'origine → gros gain de FPS.
const NB_ECHANTILLONS = 280;
const echantillons = [];
const tangentes = [];
for (let i = 0; i < NB_ECHANTILLONS; i++) {
  const t = i / NB_ECHANTILLONS;
  echantillons.push(courbe.getPointAt(t));
  tangentes.push(courbe.getTangentAt(t));
}

/* --- Sol d'herbe géant (la prairie !) --- */
const sol = new THREE.Mesh(
  new THREE.BoxGeometry(180, 1, 180),
  [
    new THREE.MeshLambertMaterial({ color: 0x8B5A2B }),
    new THREE.MeshLambertMaterial({ color: 0x8B5A2B }),
    new THREE.MeshLambertMaterial({ color: 0x7CBD56 }), // herbe dessus
    new THREE.MeshLambertMaterial({ color: 0x6E4419 }),
    new THREE.MeshLambertMaterial({ color: 0x8B5A2B }),
    new THREE.MeshLambertMaterial({ color: 0x8B5A2B }),
  ]
);
sol.position.set(3, -0.5, -2);
sol.receiveShadow = true; // le sol accueille les ombres portées
scene.add(sol);

/* Ombres portées : seuls les objets volumineux castent (sinon
   les ~4000 pavés explosent le coût du rendu d'ombres). */
function activerOmbresPortees(objet) {
  objet.traverse(enfant => { enfant.castShadow = true; });
}

/* --- Construction de la route en pavés le long de la courbe --- */
const groupeRoute = new THREE.Group();
const PAS = 2; // distance entre deux pavés
const demi = CONFIG.largeurRoute / 2;

for (let i = 0; i < NB_ECHANTILLONS; i++) {
  const t = i / NB_ECHANTILLONS;
  const p = courbe.getPointAt(t);
  const tangente = courbe.getTangentAt(t);
  const angle = Math.atan2(tangente.x, tangente.z);

  // Accotements gravier de chaque côté
  for (const cote of [-1, 1]) {
    const accot = bloc(1.4, 0.22, PAS + 0.6, COULEUR_ACCOT,
      p.x + Math.cos(angle) * (demi + 0.7) * cote, -0.05, p.z - Math.sin(angle) * (demi + 0.7) * cote);
    accot.rotation.y = angle;
    groupeRoute.add(accot);
  }

  // Pavé d'asphalte orienté dans le sens de la piste
  const pave = bloc(CONFIG.largeurRoute, 0.3, PAS + 0.6, COULEUR_ROUTE, p.x, 0.05, p.z);
  pave.rotation.y = angle;
  groupeRoute.add(pave);

  // Lignes blanches des bords
  for (const cote of [-1, 1]) {
    const ligne = bloc(0.3, 0.06, PAS + 0.6, COULEUR_LIGNE,
      p.x + Math.cos(angle) * (demi - 0.6) * cote, HAUTEUR_ROUTE + 0.03,
      p.z - Math.sin(angle) * (demi - 0.6) * cote);
    ligne.rotation.y = angle;
    groupeRoute.add(ligne);
  }

  // Pointillés au milieu (1 pavé sur 3)
  if (i % 2 === 0) { // pointillés : 1 pavé sur 2 (avec 280 échantillons)
    const milieu = bloc(0.35, 0.06, 1.2, COULEUR_LIGNE, p.x, HAUTEUR_ROUTE + 0.03, p.z);
    milieu.rotation.y = angle;
    groupeRoute.add(milieu);
  }

  // Barrières bois de chaque côté — 1 pavé sur 12 seulement
  // (moitié moins qu'avant pour laisser la place libre de
  // circuler et alléger le rendu)
  if (i % 12 === 0) {
    for (const cote of [-1, 1]) {
      const bx = p.x + Math.cos(angle) * demi * cote;
      const bz = p.z - Math.sin(angle) * demi * cote;
      groupeRoute.add(bloc(0.5, 1.2, 0.5, 0x9B7653, bx, 0.65, bz));
      groupeRoute.add(bloc(0.3, 0.25, 0.6, 0xF5F5F5, bx, 1.15, bz));
      enregistrerObstacle(bx, bz, 0.35, 'solide', null); // poteau
    }
  }
}

/* --- Ligne de départ/arrivée en damier (au début de la boucle) --- */
const depart = echantillons[0];
const angleDepart = Math.atan2(tangentes[0].x, tangentes[0].z);
const ligneDepart = new THREE.Group();
for (let i = 0; i < 10; i++) {
  const couleur = (i % 2 === 0) ? 0x111111 : 0xEEEEEE;
  const carreau = bloc(CONFIG.largeurRoute / 10, 0.06, 1.2, couleur,
    -demi + CONFIG.largeurRoute / 20 + i * CONFIG.largeurRoute / 10,
    HAUTEUR_ROUTE + 0.04, 0);
  ligneDepart.add(carreau);
}
ligneDepart.position.set(depart.x, 0, depart.z);
ligneDepart.rotation.y = angleDepart;
groupeRoute.add(ligneDepart);

scene.add(groupeRoute);

/* =========================================================
   3. LE DÉCOR : ARBRES, MAISONS ET VACHES
   Posés autour du circuit, jamais dessus.
   ========================================================= */
function creerArbre(x, z) {
  const arbre = new THREE.Group();
  arbre.add(bloc(0.7, 2.2, 0.7, 0x6E4419, 0, 1.1, 0));
  const vert = [0x2E7D32, 0x388E3C, 0x43A047][Math.floor(Math.random() * 3)];
  arbre.add(bloc(2.6, 1.0, 2.6, vert, 0, 2.7, 0));
  arbre.add(bloc(1.8, 0.9, 1.8, vert, 0, 3.6, 0));
  arbre.position.set(x, 0, z);
  enregistrerObstacle(x, z, 0.9, 'solide', arbre); // tronc
  return arbre;
}

function creerMaison(x, z, ry) {
  const maison = new THREE.Group();
  const murs = [0xD7C49E, 0xCBB994, 0xDEB887][Math.floor(Math.random() * 3)];
  maison.add(bloc(4.5, 3, 4.5, murs, 0, 1.5, 0));
  maison.add(bloc(5.2, 0.6, 5.2, 0xB71C1C, 0, 3.3, 0));
  maison.add(bloc(4.0, 0.6, 4.0, 0xB71C1C, 0, 3.9, 0));
  maison.add(bloc(2.6, 0.6, 2.6, 0xB71C1C, 0, 4.5, 0));
  maison.add(bloc(1.0, 1.6, 0.15, 0x5D4037, 0, 0.8, 2.3));
  maison.add(bloc(1.0, 1.0, 0.15, 0x81D4FA, -1.5, 1.8, 2.3));
  maison.add(bloc(1.0, 1.0, 0.15, 0x81D4FA, 1.5, 1.8, 2.3));
  maison.position.set(x, 0, z);
  maison.rotation.y = ry;
  enregistrerObstacle(x, z, 2.8, 'solide', maison); // murs + toit
  return maison;
}

/* Une vache Minecraft : corps blanc à taches, tête, cornes */
function creerVache(x, z) {
  const vache = new THREE.Group();
  vache.add(bloc(1.4, 1.0, 2.4, 0xF5F5F5, 0, 1.3, 0));          // corps
  vache.add(bloc(0.6, 0.5, 0.6, 0x37474F, -0.45, 1.5, 0.3));    // tache
  vache.add(bloc(0.6, 0.5, 0.6, 0x37474F, 0.4, 1.2, -0.6));    // tache
  vache.add(bloc(0.8, 0.8, 0.7, 0xF5F5F5, 0, 1.8, -1.5));      // tête
  vache.add(bloc(0.55, 0.45, 0.1, 0xFFCDD2, 0, 1.7, -1.9));     // museau
  vache.add(bloc(0.15, 0.15, 0.3, 0x8D6E63, -0.3, 2.25, -1.5)); // corne
  vache.add(bloc(0.15, 0.15, 0.3, 0x8D6E63, 0.3, 2.25, -1.5));  // corne
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, -0.45, 0.5, -0.8)); // pattes
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, 0.45, 0.5, -0.8));
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, -0.45, 0.5, 0.8));
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, 0.45, 0.5, 0.8));
  vache.position.set(x, 0, z);
  vache.rotation.y = Math.random() * Math.PI * 2;
  enregistrerObstacle(x, z, 1.2, 'vache', vache); // corps (poussable)
  return vache;
}

/* Un point est-il trop près de la piste ? (pour ne pas
   poser le décor dessus) */
function distanceALaPiste(x, z) {
  let min = Infinity;
  for (let i = 0; i < NB_ECHANTILLONS; i += 3) {
    const dx = echantillons[i].x - x;
    const dz = echantillons[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < min) min = d;
  }
  return Math.sqrt(min);
}

/* Remplit la prairie : arbres, maisons, vaches */
for (let essai = 0; essai < 350; essai++) {
  const x = 3 + (Math.random() - 0.5) * 170;
  const z = -2 + (Math.random() - 0.5) * 170;
  const d = distanceALaPiste(x, z);
  const r = Math.random();
  function poser(decor) {
    activerOmbresPortees(decor); // maisons/arbres/vaches projettent une ombre
    scene.add(decor);
  }
  if (d > demi + 3 && d < demi + 12) {
    // Près de la piste : surtout des vaches (la prairie !)
    if (r < 0.5) poser(creerVache(x, z));
    else if (r < 0.8) poser(creerArbre(x, z));
    else poser(creerMaison(x, z, Math.random() * Math.PI * 2));
  } else if (d > 20 && r < 0.75) {
    // Loin : arbres et quelques vaches
    if (r < 0.55) poser(creerArbre(x, z));
    else poser(creerVache(x, z));
  }
}

/* =========================================================
   4. LA VOITURE (pickup + creeper en armure d'or)
   ========================================================= */
const OR = 0xFFD54F;
const OR_SOMBRE = 0xF9A825;

function creerCreeper(x, y, z) {
  const perso = new THREE.Group();
  const U = 0.5;

  const tete = new THREE.Group();
  tete.add(bloc(U, U, U, 0x4CAF50, 0, 0, 0));
  tete.add(bloc(0.12, 0.12, 0.04, 0x111111, -0.12, 0.08, -U/2 - 0.01));
  tete.add(bloc(0.12, 0.12, 0.04, 0x111111, 0.12, 0.08, -U/2 - 0.01));
  tete.add(bloc(0.12, 0.10, 0.04, 0x111111, 0, -0.07, -U/2 - 0.01));
  tete.add(bloc(0.12, 0.22, 0.04, 0x111111, -0.12, -0.14, -U/2 - 0.01));
  tete.add(bloc(0.12, 0.22, 0.04, 0x111111, 0.12, -0.14, -U/2 - 0.01));
  tete.position.set(0, U * 1.55, 0);
  perso.add(tete);

  const torse = new THREE.Group();
  torse.add(bloc(U, U * 1.2, U * 0.6, OR, 0, 0, 0));
  torse.add(bloc(U * 0.9, U * 0.3, 0.04, OR_SOMBRE, 0, -U * 0.35, -U * 0.3 - 0.01));
  torse.add(bloc(U * 0.5, U * 0.4, U * 0.7, OR, -U * 0.75, U * 0.45, 0));
  torse.add(bloc(U * 0.5, U * 0.4, U * 0.7, OR, U * 0.75, U * 0.45, 0));
  torse.position.set(0, U * 0.7, 0);
  perso.add(torse);

  perso.add(bloc(U * 0.25, U * 0.25, U * 0.9, OR, -U * 0.55, U * 0.85, -U * 0.3));
  perso.add(bloc(U * 0.25, U * 0.25, U * 0.9, OR, U * 0.55, U * 0.85, -U * 0.3));

  perso.add(bloc(U * 0.35, U * 0.35, U * 0.9, OR_SOMBRE, -U * 0.25, U * 0.1, -U * 0.3));
  perso.add(bloc(U * 0.35, U * 0.35, U * 0.9, OR_SOMBRE, U * 0.25, U * 0.1, -U * 0.3));
  perso.add(bloc(U * 0.4, U * 0.25, U * 0.4, OR, -U * 0.25, U * 0.1, -U * 0.75));
  perso.add(bloc(U * 0.4, U * 0.25, U * 0.4, OR, U * 0.25, U * 0.1, -U * 0.75));

  perso.position.set(x, y, z);
  return perso;
}

function creerPickup() {
  const pickup = new THREE.Group();

  pickup.add(bloc(1.8, 0.4, 4.4, 0x444444, 0, 0.35, 0));
  pickup.add(bloc(1.8, 1.0, 1.6, 0xE53935, 0, 1.1, -1.2));
  pickup.add(bloc(1.6, 0.6, 0.1, 0x81D4FA, 0, 1.4, -2.02));
  pickup.add(bloc(0.1, 0.6, 1.4, 0x81D4FA, -0.86, 1.4, -1.2));
  pickup.add(bloc(0.1, 0.6, 1.4, 0x81D4FA, 0.86, 1.4, -1.2));
  pickup.add(bloc(1.8, 0.6, 1.0, 0xE53935, 0, 0.85, -2.5));
  pickup.add(bloc(1.6, 0.2, 0.9, 0xB71C1C, 0, 0.62, -2.5));
  pickup.add(bloc(0.4, 0.3, 0.15, 0xFFF9C4, -0.6, 0.75, -3.05));
  pickup.add(bloc(0.4, 0.3, 0.15, 0xFFF9C4, 0.6, 0.75, -3.05));
  pickup.add(bloc(1.8, 0.15, 2.2, 0xB71C1C, 0, 0.65, 1.0));
  pickup.add(bloc(1.8, 0.7, 0.15, 0xE53935, 0, 1.0, 2.1));
  pickup.add(bloc(0.15, 0.7, 2.2, 0xE53935, -0.85, 1.0, 1.0));
  pickup.add(bloc(0.15, 0.7, 2.2, 0xE53935, 0.85, 1.0, 1.0));
  pickup.add(bloc(1.4, 0.3, 0.1, 0x9E9E9E, 0, 0.55, -3.02));
  pickup.add(bloc(0.4, 0.25, 0.12, 0xFF1744, -0.6, 1.05, 2.18));
  pickup.add(bloc(0.4, 0.25, 0.12, 0xFF1744, 0.6, 1.05, 2.18));

  pickup.add(creerCreeper(0, 1.0, -1.0));

  for (const [rx, rz] of [[-0.95, -1.5], [0.95, -1.5], [-0.95, 1.4], [0.95, 1.4]]) {
    pickup.add(bloc(0.3, 0.9, 0.9, 0x212121, rx, 0.55, rz));
    pickup.add(bloc(0.32, 0.4, 0.4, 0x757575, rx, 0.55, rz));
  }

  return pickup;
}

const pickup = creerPickup();
activerOmbresPortees(pickup); // la voiture projette une ombre
scene.add(pickup);

/* ---------- NUAGES LOW-POLY (ambiance) ----------
   Quelques blocs blancs en altitude qui dérivent
   lentement : ~12 draw calls, quasi gratuit. */
const nuages = [];
for (let i = 0; i < 6; i++) {
  const nuage = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const t = bloc(4 + Math.random() * 4, 1.2, 3 + Math.random() * 3, 0xFFFFFF,
      (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 3);
    t.material = null; // remplacé juste après par un matériau non éclairé
    nuage.add(t);
  }
  // matériau blanc non éclairé, insensible au fog pour rester visible
  nuage.traverse(e => { if (e.isMesh) e.material = new THREE.MeshBasicMaterial({ color: 0xFFFFFF }); e.receiveShadow = false; });
  nuage.position.set((Math.random() - 0.5) * 260, 42 + Math.random() * 8, (Math.random() - 0.5) * 260);
  scene.add(nuage);
  nuages.push(nuage);
}

/* =========================================================
   6. DIAMANTS À RAMASSER
   Posés au-dessus de la piste, à intervalles réguliers.
   On les touche → ils disparaissent et le score monte !
   ========================================================= */
let score = 0;
let numTour = 1;
const scoreElt = document.getElementById('score');
const tourElt = document.getElementById('tour');

/* ---------- CHRONO DE TOUR ----------
   Le chrono démarre dès qu'on avance, puis à chaque
   franchissement de la ligne de damier on mémorise le
   temps du tour écoulé. Le MEILLEUR est sauvegardé dans
   localStorage (il reste même après rechargement).
   Format : MM:SS:CC (minutes : secondes : centièmes) */
const chronoElt = document.getElementById('chrono');
let debutTour = null; // timestamp du début du tour en cours
let dernierTour = null;  // temps du tour PRÉCÉDENT (affiché DERNIER)
let meilleurTour = parseFloat(localStorage.getItem('meilleurTour')) || null;

function formaterTemps(ms) {
  if (ms == null) return '00:00:00';
  const minutes = Math.floor(ms / 60000);
  const secondes = Math.floor((ms % 60000) / 1000);
  const centiemes = Math.floor((ms % 1000) / 10);
  const p = n => String(n).padStart(2, '0');
  return p(minutes) + ':' + p(secondes) + ':' + p(centiemes);
}

function majChrono(ms) {
  chronoElt.textContent = 'TOUR : ' + formaterTemps(ms)
    + '\nDERNIER : ' + formaterTemps(dernierTour)
    + '\nMEILLEUR : ' + formaterTemps(meilleurTour);
}
majChrono(null);

const diamants = [];
function creerDiamant(x, y, z) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0x4FC3F7, transparent: true, opacity: 0.9 });
  g.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.55), mat));
  g.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.35), new THREE.MeshLambertMaterial({ color: 0xB3E5FC })));
  g.position.set(x, y, z);
  g.userData.baseY = y;
  scene.add(g);
  diamants.push(g);
  return g;
}

// Un diamant tous les ~60 pas, au milieu de la piste
for (let i = 0; i < NB_ECHANTILLONS; i += 24) { // un diamant tous les ~24 pavés (~12 diamants par tour)
  const p = echantillons[i];
  creerDiamant(p.x, 1.4, p.z);
}

/* =========================================================
   5. CLAVIER + KLAXON CANARD
   ========================================================= */
const touches = {};
addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  touches[e.code] = true;
  if (e.code === 'Space') klaxonCanard();
});
addEventListener('keyup', e => { touches[e.code] = false; });

let ctxAudio = null;
/* Un petit "meuh" de vache quand on en pousse une */
function meuh() {
  if (meuh.dernier && performance.now() - meuh.dernier < 800) return; // anti-spam
  meuh.dernier = performance.now();
  if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctxAudio.currentTime;

  const osc = ctxAudio.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(140, t + 0.3);
  osc.frequency.linearRampToValueAtTime(110, t + 0.5);

  const filtre = ctxAudio.createBiquadFilter();
  filtre.type = 'lowpass';
  filtre.frequency.value = 700;

  const gain = ctxAudio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

  osc.connect(filtre);
  filtre.connect(gain);
  gain.connect(ctxAudio.destination);

  osc.start(t);
  osc.stop(t + 0.6);
}

function klaxonCanard() {
  if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctxAudio.currentTime;

  const osc = ctxAudio.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(250, t);
  osc.frequency.exponentialRampToValueAtTime(600, t + 0.08);
  osc.frequency.exponentialRampToValueAtTime(180, t + 0.25);

  const filtre = ctxAudio.createBiquadFilter();
  filtre.type = 'bandpass';
  filtre.frequency.value = 900;
  filtre.Q.value = 1.5;

  const gain = ctxAudio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(filtre);
  filtre.connect(gain);
  gain.connect(ctxAudio.destination);

  osc.start(t);
  osc.stop(t + 0.3);
}

/* =========================================================
   6bis. MISE À JOUR : CONDUITE SUR LE CIRCUIT
   La voiture a maintenant une vraie position (x, z) et un
   cap (angle). Les flèches gauche/droite font tourner le
   cap, la voiture avance dans sa direction. Si elle sort
   de la piste, elle ralentit dans l'herbe. Passer la
   ligne de damier = un tour de plus !
   ========================================================= */
// Position de départ : un peu AVANT la ligne de damier
// dans le sens de course. On roule dans le sens INVERSE
// du circuit (cap = tangente retournée), donc on démarre
// juste APRÈS l'indice 0 (la ligne) : en avançant à
// l'envers (indices qui diminuent), on franchit la ligne
// de damier tout de suite, puis on continue vers les
// indices élevés.
const INDICE_DEPART = 15;
const posDepart = echantillons[INDICE_DEPART];
const voiture = {
  x: posDepart.x,
  z: posDepart.z,
  cap: Math.atan2(-tangentes[INDICE_DEPART].x, -tangentes[INDICE_DEPART].z), // sens inverse !
  vitesse: 0,
  surPiste: true,
  dernierIndice: INDICE_DEPART, // pour compter les tours
};

// Trouve le point de la piste le plus proche de la voiture
function pointLePlusProche(x, z) {
  let min = Infinity, indice = 0;
  // recherche locale autour du dernier indice connu (rapide,
  // symétrique car on roule dans les deux sens)
  for (let delta = -40; delta <= 40; delta++) {
    const i = (voiture.dernierIndice + delta + NB_ECHANTILLONS) % NB_ECHANTILLONS;
    const dx = echantillons[i].x - x;
    const dz = echantillons[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < min) { min = d; indice = i; }
  }
  return { indice, distance: Math.sqrt(min) };
}

function update() {
  // Accélérer / freiner / ralentir
  if (touches['ArrowUp'])   voiture.vitesse = Math.min(CONFIG.vitesseMax, voiture.vitesse + CONFIG.acceleration);
  if (touches['ArrowDown']) voiture.vitesse = Math.max(-CONFIG.vitesseMax * 0.5, voiture.vitesse - CONFIG.freinage);
  if (!touches['ArrowUp'] && !touches['ArrowDown']) {
    if (voiture.vitesse > 0) voiture.vitesse = Math.max(0, voiture.vitesse - CONFIG.ralentissement);
    if (voiture.vitesse < 0) voiture.vitesse = Math.min(0, voiture.vitesse + CONFIG.ralentissement);
  }

  // Tourner : les flèches font pivoter le cap du pickup
  const facteurVitesse = Math.abs(voiture.vitesse) / CONFIG.vitesseMax; // on tourne moins à l'arrêt
  let direction = 0;
  if (touches['ArrowLeft'])  { voiture.cap += CONFIG.vitesseVirage * (voiture.vitesse >= 0 ? 1 : -1) * facteurVitesse; direction = -1; }
  if (touches['ArrowRight']) { voiture.cap -= CONFIG.vitesseVirage * (voiture.vitesse >= 0 ? 1 : -1) * facteurVitesse; direction = 1; }

  // Avancer dans la direction du cap
  voiture.x += Math.sin(voiture.cap) * voiture.vitesse;
  voiture.z += Math.cos(voiture.cap) * voiture.vitesse;

  // --- COLLISIONS ---
  // La voiture est un cercle (rayon 1.8). Contre un obstacle
  // SOLIDE (barrière, maison, arbre) : on est repoussé le long
  // de la normale et la vitesse est amortie (rebond doux,
  // jamais de blocage violent). Contre une VACHE : c'est la
  // vache qui se fait pousser (option A) + petit meuh !
  const RAYON_VOITURE = 1.2; // resserré : la voiture ne doit être freinée qu'au vrai contact
  for (const obs of obstacles) {
    const dx = voiture.x - obs.x;
    const dz = voiture.z - obs.z;
    const distMin = RAYON_VOITURE + obs.rayon;
    const d2 = dx * dx + dz * dz;
    if (d2 < distMin * distMin) {
      const d = Math.sqrt(d2) || 0.001; // évite la division par zéro
      const nx = dx / d, nz = dz / d;   // normale du contact

      if (obs.type === 'vache') {
        // OPTION A : la vache glisse doucement devant la voiture
        const poussee = distMin - d;
        obs.x -= nx * poussee;
        obs.z -= nz * poussee;
        obs.mesh.position.set(obs.x, 0, obs.z);
        voiture.vitesse *= 0.9; // on freine à peine
        meuh();
      } else {
        // SOLIDE : repoussement + rebond amorti
        voiture.x += nx * (distMin - d);
        voiture.z += nz * (distMin - d);
        voiture.vitesse *= -0.35; // léger rebond en arrière
      }
    }
  }

  // Suis-je sur la piste ? (assez près du centre de la courbe)
  const proche = pointLePlusProche(voiture.x, voiture.z);
  voiture.dernierIndice = proche.indice;
  voiture.surPiste = proche.distance < demi + 1.2;

  // Dans l'herbe : la vitesse est limitée (et on ralentit vite)
  const vitessePlafond = voiture.surPiste ? CONFIG.vitesseMax : CONFIG.vitesseHerbe;
  if (voiture.vitesse > vitessePlafond) {
    voiture.vitesse = Math.max(vitessePlafond, voiture.vitesse - 0.02);
  }

  // Compteur de tours : franchir la ligne de damier.
  // Sens inverse : on passe du début de la boucle (indices
  // proches de 0) vers sa fin (indices proches du max)
  const ancien = update.dernierIndice ?? INDICE_DEPART;
  if (ancien < NB_ECHANTILLONS * 0.2 && voiture.dernierIndice > NB_ECHANTILLONS * 0.8 && voiture.vitesse > 0) {
    numTour++;
    tourElt.textContent = `🏁 Tour ${numTour}`;

    // Chrono : ligne franchie. La PREMIÈRE fois, on démarre
    // le chrono du tour 1 ; ensuite on mémorise le temps du
    // tour fini et on garde le MEILLEUR
    const maintenant = performance.now();
    if (debutTour !== null) {
      const duree = maintenant - debutTour;
      dernierTour = duree; // le tour fini devient le DERNIER
      if (meilleurTour === null || duree < meilleurTour) {
        meilleurTour = duree;
        localStorage.setItem('meilleurTour', String(duree));
      }
    }
    debutTour = maintenant; // nouveau tour : le chrono repart
  }

  // Affichage du chrono. Avant la ligne de départ il reste
  // à 00:00:00 : il ne démarre qu'au premier franchissement
  majChrono(debutTour === null ? 0 : performance.now() - debutTour);
  update.dernierIndice = voiture.dernierIndice;


  // Placer la voiture (légère inclinaison dans les virages)
  pickup.position.set(voiture.x, HAUTEUR_ROUTE, voiture.z);
  pickup.rotation.y = voiture.cap + Math.PI; // l'avant du pickup regarde vers -z
  pickup.rotation.z = direction * 0.08 * facteurVitesse;

  // Diamants : ils tournent, flottent, et se ramassent au contact
  const t = performance.now() / 1000;

  // Nuages : dérive lente en altitude
  for (const n of nuages) {
    n.position.x += 0.01;
    if (n.position.x > 140) n.position.x = -140; // reboucle à l'autre bout
  }

  for (let i = diamants.length - 1; i >= 0; i--) {
    const d = diamants[i];
    d.rotation.y = t * 2;
    d.position.y = d.userData.baseY + Math.sin(t * 2.5 + i) * 0.25;
    const dx = d.position.x - voiture.x;
    const dz = d.position.z - voiture.z;
    if (dx * dx + dz * dz < 3.2) {
      scene.remove(d);
      diamants.splice(i, 1);
      score++;
      scoreElt.textContent = `💎 ${score}`;
    }
  }

  // Caméra de poursuite : derrière la voiture, dans son sens
  const hauteurCam = 4.5, distanceCam = 12;
  const cibleCam = new THREE.Vector3(voiture.x, 1.5, voiture.z);
  const posCamVoulue = new THREE.Vector3(
    voiture.x - Math.sin(voiture.cap) * distanceCam,
    hauteurCam,
    voiture.z - Math.cos(voiture.cap) * distanceCam
  );
  camera.position.lerp(posCamVoulue, 0.08);
  camera.lookAt(cibleCam);
}

/* ---------- COMPTEUR FPS (bas à gauche) ----------
   Moyenne glissante sur ~500 ms pour un chiffre stable.
   Affiche aussi le nombre de draw calls (renderer.info),
   utile pour comprendre d'où viennent les ralentissements. */
const fpsElt = document.getElementById('fps');
let fpsFrames = 0;
let fpsDerniereMesure = performance.now();

function mesurerFPS() {
  fpsFrames++;
  const maintenant = performance.now();
  if (maintenant - fpsDerniereMesure >= 500) {
    const fps = Math.round((fpsFrames * 1000) / (maintenant - fpsDerniereMesure));
    const drawCalls = renderer.info.render.calls;
    fpsElt.textContent = fps + ' FPS | ' + drawCalls + ' draws';
    fpsFrames = 0;
    fpsDerniereMesure = maintenant;
  }
}

function animer() {
  requestAnimationFrame(animer);
  update();
  renderer.render(scene, camera);
  mesurerFPS();
}
animer();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
