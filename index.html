<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pickup Minecraft — Prairie Meuh Meuh</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px;
    font: bold 22px/1.2 "Courier New", monospace; color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f; user-select: none; text-align: center;
  }
  #hud span { background: rgba(0,0,0,0.45); padding: 6px 14px; border-radius: 6px; }
  #pause {
    display: none;
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font: bold 26px/1.4 "Courier New", monospace; color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f; background: rgba(0,0,0,0.6);
    padding: 16px 28px; border-radius: 10px; user-select: none;
    text-align: center; z-index: 10;
  }
  #minimap {
    position: fixed; top: 12px; left: 12px;
    border-radius: 8px; user-select: none;
  }
  #chrono {
    position: fixed; top: 12px; right: 14px;
    font: bold 20px/1.5 "Courier New", monospace; color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f; background: rgba(0,0,0,0.45);
    padding: 6px 14px; border-radius: 6px; user-select: none;
    text-align: right; white-space: pre;
  }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font: bold 16px/1.4 "Courier New", monospace; color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f; background: rgba(0,0,0,0.4);
    padding: 8px 16px; border-radius: 6px; user-select: none;
    text-align: center;
  }
  #fps {
    position: fixed; bottom: 12px; left: 14px;
    font: bold 14px/1.4 "Courier New", monospace; color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f; background: rgba(0,0,0,0.4);
    padding: 4px 10px; border-radius: 6px; user-select: none;
  }

  /* ---------- CONTRÔLES TACTILES (mobile uniquement) ----------
     Cachés par défaut : ne s'affichent que si le jeu détecte
     un téléphone / une tablette (classe .mobile sur <body>).
     Boutons gros (min 64px) et en bas : accessibles au pouce. */
  #tactile { display: none; }
  body.mobile #tactile {
    display: flex; position: fixed; inset: 0;
    flex-direction: row; align-items: flex-end;
    touch-action: none; user-select: none; -webkit-user-select: none;
    z-index: 5; pointer-events: none; /* le vide laisse passer les clics */
  }
  /* Deux zones pouce côte à côte en bas : gauche = direction,
     droite = gaz/frein + klaxon. Le grand gap et le justify-content
     garantissent l'écart entre boutons, aucun chevauchement possible
     quelle que soit la taille de l'écran. */
  body.mobile #tactile .zone {
    display: flex; align-items: flex-end;
    gap: 26px;
    padding: 10px 16px 46px;
    pointer-events: none;
  }
  /* Direction calée en BAS À GAUCHE de l'écran */
  #zoneGauche { justify-content: flex-start; }
  #zoneDroite { justify-content: flex-end; margin-left: auto; }
  /* GROS boutons confortables : 130x130 px de hitbox (= visuel =
     zone tactile, pas de hitbox plus petite que le bouton dessiné).
     Sur petit écran ça descend à ~88px minimum (media queries plus
     bas) — toujours dans la zone confortable au pouce. */
  body.mobile #tactile .btn {
    pointer-events: auto;
    width: 130px; height: 130px; border-radius: 28px;
    background: rgba(0,0,0,0.45);
    border: 4px solid rgba(255,255,255,0.8);
    color: #fff; font: bold 56px/1 "Courier New", monospace;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    flex: 0 0 auto;
  }
  body.mobile #tactile .btn:active { background: rgba(255,255,255,0.5); }
  body.mobile #tactile .btn.grand { width: 150px; height: 150px; } /* gaz */
  /* Très petits écrans : on garde le maximum possible tout en
     rentrant, l'écart reste assuré par le gap. */
  @media (max-width: 480px) {
    body.mobile #tactile .btn { width: 100px; height: 100px; font-size: 44px; }
    body.mobile #tactile .btn.grand { width: 116px; height: 116px; }
    body.mobile #tactile .zone { gap: 16px; padding: 12px 14px 20px; }
  }
  @media (max-width: 380px) {
    body.mobile #tactile .btn { width: 88px; height: 88px; font-size: 38px; }
    body.mobile #tactile .btn.grand { width: 100px; height: 100px; }
    body.mobile #tactile .zone { gap: 12px; }
  }

  /* ---------- UI adaptée aux petits écrans ---------- */
  @media (max-width: 700px) {
    #hud { font-size: 14px; gap: 6px; top: 6px; }
    #hud span { padding: 3px 8px; }
    #minimap { width: 84px; height: 84px; top: 6px; left: 6px; }
    #chrono { font-size: 11px; top: 6px; right: 6px; padding: 3px 6px; }
    #fps { font-size: 11px; bottom: 6px; left: 6px; }
    #info { display: none; } /* les indications clavier ne servent pas sur mobile */
    body:not(.mobile) #info { display: block; font-size: 13px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="hud">
  <span id="tour">&#127937; Tour 1</span>
</div>
<div id="chrono">TOUR : 00:00:00
DERNIER : 00:00:00
MEILLEUR : 00:00:00</div>
<div id="fps">-- FPS</div>
<canvas id="minimap" width="150" height="150"></canvas>
<div id="info">&#8593; avancer &nbsp; &#8595; freiner/reculer &nbsp; &#8592; &#8594; tourner<br>Espace : klaxon (canard) &#129414;</div>

<!-- Contrôles tactiles : affichés uniquement sur mobile (voir détection plus bas).
     Le <span> intérieur est le visuel ; le <button> autour est la hitbox étendue. -->
<div id="tactile">
  <div class="zone" id="zoneGauche">
    <button class="btn" id="btnGauche"  data-touche="ArrowLeft"  aria-label="Tourner à gauche">&#8592;</button>
    <button class="btn" id="btnDroite"  data-touche="ArrowRight" aria-label="Tourner à droite">&#8594;</button>
  </div>
  <div class="zone" id="zoneDroite">
    <button class="btn" id="btnFrein"   data-touche="ArrowDown"  aria-label="Freiner">&#9660;</button>
    <button class="btn grand" id="btnGaz" data-touche="ArrowUp" aria-label="Accélérer">&#9650;</button>
    <button class="btn" id="btnKlaxon"  data-touche="Klaxon"     aria-label="Klaxon canard">&#129414;</button>
  </div>
</div>

<!-- Three.js via CDN : rien à installer, il faut juste internet -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   PICKUP MINECRAFT — PRAIRIE MEUH MEUH (circuit fermé)
   1. Scène, caméra, lumières
   2. Le circuit : une boucle fermée (spline) façon Mario
      Kart "Prairie Meuh Meuh" — virages en S, grandes
      courbes, ligne d'arrivée en damier
   3. Le décor : herbe, arbres, maisons et VACHES
   4. La voiture (pickup + creeper en armure d'or)
   5. La conduite : la voiture tourne vraiment, elle peut
      sortir de la piste (ralentit dans l'herbe)
   6. Compteur de tours
   7. Klaxon canard
   ========================================================= */

/* ---------- 1. SCÈNE, CAMÉRA, LUMIÈRES ---------- */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xBFE8FF, 260, 520); // brume repoussée : circuit Meuh Meuh très étendu

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
// P4 : on limite la densité de pixels (sur écran Retina/4K, le rendu
// coûte 4x plus cher — 1.5 est un bon compromis netteté/perf)
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
// Ombres douces (PCFSoft) : surcoût maîtrisé par la zone
// resserrée de la shadow camera dans la lumière du soleil
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- LUMIÈRE RÉALISTE + SOLEIL (dans le skydome)
   La lumière directionnelle est rehaussée (60, 90, 40)
   pour des ombres naturelles, avec une shadow map
   resserrée sur la zone de jeu (perf). Le soleil visible
   est dessiné dans le shader du skydome (voir plus bas),
   aligné sur la direction exacte de la lumière.
   L'ambient légèrement bleuté complète l'ambiance. */
const POSITION_SOLEIL = new THREE.Vector3(60, 90, 40);

/* ---------- SKYDOME DÉGRADÉ + SOLEIL (shader)
   Grande sphère inversée (BackSide) rendue avec un
   ShaderMaterial très léger : dégradé vertical bleu
   (profond en haut, clair à l'horizon) + disque solaire
   dessiné dans la direction exacte de la DirectionalLight
   (donc toujours cohérent avec les ombres). fog: false et
   depthWrite: false → coût quasi nul (1 draw call). */
const DIRECTION_SOLEIL = POSITION_SOLEIL.clone().normalize();
const skydome = new THREE.Mesh(
  new THREE.SphereGeometry(360, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    fog: false,
    depthWrite: false,
    uniforms: {
      couleurZenith: { value: new THREE.Color(0x3D7BC4) }, // bleu profond en haut
      couleurHorizon: { value: new THREE.Color(0xBFE8FF) }, // bleu clair à l'horizon
      couleurLisiere: { value: new THREE.Color(0xE8F7FF) }, // liseré pâle tout en bas
      dirSoleil: { value: DIRECTION_SOLEIL },
      couleurSoleil: { value: new THREE.Color(0xFFF3B0) }, // disque solaire
      couleurHalo: { value: new THREE.Color(0xFFE994) },   // halo doux autour
    },
    vertexShader: `
      varying vec3 vDirection;
      void main() {
        vDirection = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDirection;
      uniform vec3 couleurZenith, couleurHorizon, couleurLisiere;
      uniform vec3 dirSoleil, couleurSoleil, couleurHalo;
      void main() {
        vec3 dir = normalize(vDirection);
        // Dégradé vertical : 1 en haut (zénith), 0 à l'horizon
        float h = clamp(dir.y, 0.0, 1.0);
        vec3 ciel = mix(couleurHorizon, couleurZenith, pow(h, 0.55));
        // Liseré pâle juste sous/à l'horizon
        ciel = mix(ciel, couleurLisiere, smoothstep(0.0, -0.15, dir.y));
        // Soleil : disque net + halo doux dans la direction de la lumière
        float aligne = dot(dir, normalize(dirSoleil));
        float disque = smoothstep(0.9985, 0.9995, aligne);
        float halo = smoothstep(0.94, 0.999, aligne) * 0.55;
        ciel = mix(ciel, couleurHalo, halo);
        ciel = mix(ciel, couleurSoleil, disque);
        gl_FragColor = vec4(ciel, 1.0);
      }`
  })
);
skydome.renderOrder = -10; // rendu en premier, derrière tout le reste
scene.add(skydome);

const soleil = new THREE.DirectionalLight(0xFFF3E0, 2.2); // teinte chaude
soleil.position.copy(POSITION_SOLEIL);
soleil.castShadow = true;
// Zone couverte par les ombres : juste la piste et ses abords
soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.camera.left = -220;
soleil.shadow.camera.right = 220;
soleil.shadow.camera.top = 220;
soleil.shadow.camera.bottom = 220;
soleil.shadow.camera.near = 10;
soleil.shadow.camera.far = 600;
soleil.shadow.bias = -0.0005; // évite les artefacts de bord
scene.add(soleil);
scene.add(soleil.target); // cible au centre de la piste

scene.add(new THREE.AmbientLight(0xBFD9FF, 0.5)); // ambiance ciel

// Le soleil visible est désormais dessiné DANS le skydome
// (disque + halo doux, aligné sur DIRECTION_SOLEIL) : plus de
// géométrie dédiée, et il reste parfaitement cohérent avec
// la DirectionalLight qui projette les ombres.

/* =========================================================
   2. LE CIRCUIT
   Le tracé est une boucle fermée : une liste de points de
   passage (comme Prairie Meuh Meuh : grande courbe, virage
   en S, épingle). On construit la route en posant des
   pavés le long de la courbe. Pour modifier le circuit,
   il suffit de changer les POINTS_CIRCUIT ci-dessous !
   ========================================================= */
const CONFIG = {
  largeurRoute: 20, // route 2x plus large qu'avant (était 10)
  vitesseMax: 0.55,
  vitesseHerbe: 0.22,   // vitesse max quand on est dans l'herbe
  acceleration: 0.012,
  freinage: 0.03,
  ralentissement: 0.004,
  vitesseVirage: 0.032, // vitesse de rotation du pickup (réduite : virages plus progressifs)
  vitesseMonteeVirage: 3.5,   // rapidité à laquelle la direction prend effet (montée douce)
  vitesseDescenteVirage: 5.0, // rapidité à laquelle la direction se relâche quand on lâche
  vitesseLaterale: 0.22,
  boostVitesse: 1.30,          // vitesse instantanée quand on roule sur un panneau d'accélération (2.4x la vitesse max !)
  boostDuree: 1.2,             // durée du boost en secondes
  tremplinVitesseVerticale: 9.0,  // impulsion verticale au décollage (force du saut)
  tremplinGravite: 14.0,          // gravité pendant le vol (descente progressive)
  tremplinBoostAtterrissage: 1.0, // boost reçu au moment de retoucher le sol
  spinDuree: 1.0,              // durée du tour sur soi-même après un choc de vache (s)
  spinTours: 1.0,              // nombre de tours complets (1 = 360°)
};

const HAUTEUR_ROUTE = 0.2;
const COULEUR_ROUTE = 0x26262C; // anthracite foncé (assombri : la route doit rester sombre)
const COULEUR_LIGNE = 0xE0E0E0;
const COULEUR_ACCOT = 0x8F8770;

/* ---------- P2 : géométrie et matériaux PARTAGÉS ----------
   Avant, chaque bloc() créait sa propre BoxGeometry et son
   propre matériau → des milliers d'objets GPU distincts.
   Maintenant : UNE SEULE géométrie de cube unitaire (échelonnée
   par mesh.scale) et UN matériau par couleur (mis en cache).
   Résultat : bien moins de mémoire GPU et des draw calls
   regroupables par le moteur. */
const geoCube = new THREE.BoxGeometry(1, 1, 1); // LA géométrie partagée
const cacheMatériaux = new Map();

function matériauPour(couleur) {
  if (!cacheMatériaux.has(couleur)) {
    cacheMatériaux.set(couleur, new THREE.MeshLambertMaterial({ color: couleur }));
  }
  return cacheMatériaux.get(couleur);
}

function bloc(largeur, hauteur, profondeur, couleur, x, y, z) {
  const mesh = new THREE.Mesh(geoCube, matériauPour(couleur));
  mesh.scale.set(largeur, hauteur, profondeur); // on étire le cube unitaire
  mesh.position.set(x, y, z);
  return mesh;
}

/* --- Les points de passage du circuit (x, z) ---
   Une boucle inspirée de Prairie Meuh Meuh : grandes
   courbes larges, petits virages en S, retour en épingle
   douce. Pour créer un NOUVEAU circuit, il suffit de
   changer ces points ! */
/* Le circuit est agrandi proportionnellement : chaque point de
   passage est multiplié par ECHELLE_CIRCUIT, donc les virages,
   les lignes droites et tout le tracé gardent exactement les
   mêmes proportions (2x plus grand pour la route 2x plus large). */
const ECHELLE_CIRCUIT = 2; // 2 = circuit 2x plus grand (cohérent avec largeurRoute 2x)
/* --- NOUVEAU CIRCUIT : inspiré de « Meuh Meuh » (Moo Moo
   Meadows, Mario Kart Wii). Structure de la boucle, dans l'ordre
   (sens de course = sens INVERSE de la liste, cf. départ) :

   1. Zone de départ : courte ligne droite large (indices 0-2)
   2. Virage gauche progressif et long (3-6)
   3. Section « pré » : serpentin en S, 3 courbes douces (7-11)
   4. Virage droite + RAMPE/TREMPLIN intégré au tracé (12-14)
   5. Virage gauche (15-17)
   6. Zone ouverte avec collines et bosses (18-22) : le terrain
      monte et on COUPE par-dessus les collines d'herbe
   7. Dernier virage gauche vers la ligne d'arrivée (23-0)

   Chaque point porte son ALTITUDE (3e valeur) : la route monte
   et descend doucement — colline au fond du circuit, bosses
   marquées dans la dernière section. Le tracé est ~2x plus
   long que l'ancienne boucle. */
const POINTS_CIRCUIT = [
  // x, z, hauteur
  [0, -60, 0], [40, -60, 0],                    // 1. départ : ligne droite large
  [78, -48, 0.5], [100, -22, 1.5],              // 2. virage gauche long et progressif
  [104, 8, 2.5], [96, 34, 3],                   //   (la route commence à monter)
  [80, 56, 3], [52, 66, 2.5],                   // 3. pré : entrée du serpentin en S
  [24, 62, 2], [2, 48, 2.5], [20, 34, 3],       //   S doux (gauche-droite-gauche)
  [48, 22, 3.5], [76, 14, 4],                   //   sortie du S
  [92, -6, 4.5], [98, -30, 5],                 // 4. virage droite + montée rampe
  [84, -52, 5.5], [56, -64, 5],                // 5. virage gauche
  [24, -68, 4], [-6, -66, 3],                  // 6. zone ouverte : on descend
  [-36, -60, 2.5], [-58, -44, 3.5],            //   ... en traversant les bosses
  [-64, -18, 4.5], [-54, 2, 5.5],              //   (3 bosses marquées ici)
  [-30, 10, 6], [-12, 2, 4.5],                 // 7. dernier virage gauche
  [-4, -28, 2],                               //   point intermédiaire : plus de longue
                                              //   diagonale qui coupe le pré
].map(([x, z, h]) => [x * ECHELLE_CIRCUIT * 0.8, z * ECHELLE_CIRCUIT * 0.8, h * ECHELLE_CIRCUIT * 0.4]);
const courbe = new THREE.CatmullRomCurve3(
  POINTS_CIRCUIT.map(([x, z, h]) => new THREE.Vector3(x, h, z)),
  true,   // fermé : la boucle revient au départ
  'catmullrom',
  0.5
);

/* =========================================================
   2bis. REGISTRE D'OBSTACLES (pour les collisions)
   Chaque obstacle solide enregistre sa position (x, z) et
   son rayon de collision (cercle, insensible à la rotation).
   Types : 'solide' = repousse la voiture, 'vache' = se fait
   pousser doucement (option A).
   ========================================================= */
const obstacles = [];

function enregistrerObstacle(x, z, rayon, type, mesh) {
  const obs = { x, z, rayon, type, mesh };
  obstacles.push(obs);
  return obs;
}

/* pointLePlusProche « global » : recherche sur TOUTE la piste
   (utilisé à la génération du terrain / du décor, la voiture
   elle-même garde la version locale rapide). */
function pointLePlusProcheGlobal(x, z) {
  let min = Infinity, indice = 0;
  for (let i = 0; i < NB_ECHANTILLONS; i++) {
    const dx = echantillons[i].x - x;
    const dz = echantillons[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < min) { min = d; indice = i; }
  }
  return { indice, distance: Math.sqrt(min) };
}

/* --- HAUTEUR DE PISTE INTERPOLÉE : renvoie la hauteur exacte
   de la route en (x,z) — on projette sur le SEGMENT entre les
   deux échantillons voisins au lieu de prendre l'échantillon
   brut (paliers d'escalier → disparus). Sert à la voiture,
   aux obstacles ET au terrain (qui se colle à la route). */
function hauteurPiste(x, z, indiceProche) {
  // projette (x,z) sur le segment [i, i+1] le plus proche
  const i0 = indiceProche, i1 = (i0 + 1) % NB_ECHANTILLONS;
  const a = echantillons[i0], b = echantillons[i1];
  const abx = b.x - a.x, abz = b.z - a.z;
  const t = Math.max(0, Math.min(1,
    ((x - a.x) * abx + (z - a.z) * abz) / (abx * abx + abz * abz || 1)));
  return { hauteur: a.y + (b.y - a.y) * t, distance: Math.hypot(x - (a.x + abx * t), z - (a.z + abz * t)) };
}

/* --- On échantillonne la courbe pour connaître la piste --- */
// P3 : nombre de pavés de la route. 280 suffit largement (le pas
// entre deux pavés reste court), ça divise par ~2.5 le nombre de
// meshes par rapport aux 700 d'origine → gros gain de FPS.
const NB_ECHANTILLONS = 900; // circuit Moo Meuh ~2x plus long : plus de pavés, densité identique
const echantillons = [];
const tangentes = [];
for (let i = 0; i < NB_ECHANTILLONS; i++) {
  const t = i / NB_ECHANTILLONS;
  echantillons.push(courbe.getPointAt(t));
  tangentes.push(courbe.getTangentAt(t));
}

/* --- Sol d'herbe géant (la prairie !) ---
   Le dessus n'est PLUS une couleur unie : une texture
   pixel-art générée au démarrage (canvas 64x64, filtrage
   Nearest → look « blocs Minecraft ») donne un motif
   d'herbe tileable, et un noise world-space injecté dans
   le shader teinte le sol par grandes zones (vert clair /
   moyen / olive / doré) SANS répétition visible.
   Tout est fait au chargement : zéro requête, zéro coût
   par frame supplémentaire (1 mesh, 1 draw call de plus
   qu'avant via la texture, rien d'autre). */
const PALETTE_HERBE = [
  0x7CBD56, // vert moyen (base)
  0x8FCB63, // vert clair
  0x6DA84B, // vert foncé
  0x9BBF4E, // olive
  0xC9D46A, // touche dorée (rare)
];
function creerTextureHerbe() {
  // Grille de « blocs » : chaque pixel du canvas = 1 bloc d'herbe
  const T = 64;
  const cv = document.createElement('canvas');
  cv.width = T; cv.height = T;
  const ctx = cv.getContext('2d');
  for (let y = 0; y < T; y++) {
    for (let x = 0; x < T; x++) {
      // hash pseudo-aléatoire STABLE (ne scintille pas) et tileable
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      const r = h - Math.floor(h);
      let couleur;
      if (r < 0.42) couleur = PALETTE_HERBE[0];      // majoritairement moyen
      else if (r < 0.70) couleur = PALETTE_HERBE[1];   // souvent clair
      else if (r < 0.88) couleur = PALETTE_HERBE[2];   // un peu foncé
      else if (r < 0.97) couleur = PALETTE_HERBE[3];   // rarement olive
      else couleur = PALETTE_HERBE[4];                // très rare doré
      ctx.fillStyle = '#' + couleur.toString(16).padStart(6, '0');
      ctx.fillRect(x, y, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; // pixels nets → style blocs
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(180, 180);            // 1 bloc d'herbe = 1 unité monde
  return tex;
}
const matSolDessus = new THREE.MeshLambertMaterial({ map: creerTextureHerbe() });
// Noise world-space (sans répétition) : teinte le sol par grandes taches
matSolDessus.onBeforeCompile = (shader) => {
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `
      #include <common>
      varying vec3 vMonde;`) // position monde du fragment
    .replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vMonde = (modelMatrix * vec4(position, 1.0)).xyz;`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `
      #include <common>
      varying vec3 vMonde;
      // hash 2D stable, sans texture
      float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      // noise value lissé sur une GRANDE échelle (taches de ~15 blocs)
      float bruit(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x),
                   mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);
      }`)
    .replace('#include <color_fragment>', `
      #include <color_fragment>
      // Nuit de teinte world-space : mixe vers olive/doré par taches
      float n = bruit(vMonde.xz * 0.065);
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.92, 0.90, 0.62), n * 0.45);
      diffuseColor.rgb *= 0.92 + 0.16 * bruit(vMonde.xz * 0.31); // grain fin`);
};
/* Terrain vallonné : la prairie n'est plus plate — des collines
   douces (bruit sinusoïdal multi-octaves) bordent la piste et
   se fondent avec ses montées. Résolution 96x96 : assez fin pour
   des collines, léger pour le GPU (1 draw call). */
function hauteurTerrainBrute(x, z) {
  // collines douces, amplitude modérée
  return 2.2 * Math.sin(x * 0.018) * Math.cos(z * 0.015)
       + 1.4 * Math.sin(x * 0.045 + 1.3) * Math.cos(z * 0.04 + 0.6)
       + 0.8 * Math.sin((x + z) * 0.09);
}
/* Le terrain se FOND avec la route : à proximité de la piste
   (dist < demi+8), on interpole entre la hauteur de la ROUTE
   et les collines — la prairie épouse la route, ne flotte
   plus au-dessus et ne l'engloutit plus. C'est ce qui faisait
   « flotter/s'enfoncer » la voiture et les vaches hors piste. */
function hauteurTerrain(x, z) {
  const proche = pointLePlusProcheGlobal(x, z);
  const hPiste = hauteurPiste(x, z, proche.indice).hauteur;
  const hBrute = hauteurTerrainBrute(x, z);
  const d = proche.distance;
  const FUSION = demi + 8;              // distance de fusion route ↔ prairie
  if (d >= FUSION) return hBrute;
  // près de la route : hauteur de route ; puis on glisse vers les collines
  const k = Math.min(1, Math.max(0, (d - demi) / (FUSION - demi)));
  return hPiste + (hBrute - hPiste) * k;
}
const TERRAILLE_T = 96;                 // résolution du maillage
const geoTerrain = new THREE.PlaneGeometry(700, 700, TERRAILLE_T, TERRAILLE_T);
geoTerrain.rotateX(-Math.PI / 2);       // à plat, normal vers le haut
{
  const pos = geoTerrain.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, Math.max(0, hauteurTerrain(pos.getX(i), pos.getZ(i)) + 0.0));
  }
  geoTerrain.computeVertexNormals();
}
const sol = new THREE.Mesh(geoTerrain, matSolDessus); // herbe texturée dessus
sol.position.set(0, 0, 0);
sol.receiveShadow = true; // le sol accueille les ombres portées
scene.add(sol);

/* Ombres portées : seuls les objets volumineux castent (sinon
   les ~4000 pavés explosent le coût du rendu d'ombres). */
function activerOmbresPortees(objet) {
  objet.traverse(enfant => { enfant.castShadow = true; });
}

/* --- Construction de la route en pavés le long de la courbe --- */

/* IMPORTANT (anti-scintillement) : les pavés se chevauchent
   légèrement (longueur PAS + 0.6 pour un espacement ~2.3) et
   leurs faces supérieures sont coplanaires. Toute différence de
   texture ou de teinte entre deux pavés voisins fait « clignoter »
   la zone de chevauchement (z-fighting) dès que la caméra bouge.
   → Tous les pavés partagent donc la MÊME couleur unie : deux
   faces identiques qui se chevauchent sont indiscernables.
   Le style vient des marquages (bordures, pointillés), pas de
   l'asphalte lui-même. */
const groupeRoute = new THREE.Group();
const PAS = 2; // distance entre deux pavés
const demi = CONFIG.largeurRoute / 2;

for (let i = 0; i < NB_ECHANTILLONS; i++) {
  const t = i / NB_ECHANTILLONS;
  const p = courbe.getPointAt(t);
  const tangente = courbe.getTangentAt(t);
  const angle = Math.atan2(tangente.x, tangente.z);

  // Accotements gravier de chaque côté (suivent l'altitude)
  for (const cote of [-1, 1]) {
    const accot = bloc(1.4, 0.22, PAS + 0.6, COULEUR_ACCOT,
      p.x + Math.cos(angle) * (demi + 0.7) * cote, p.y - 0.05, p.z - Math.sin(angle) * (demi + 0.7) * cote);
    accot.rotation.y = angle;
    groupeRoute.add(accot);
  }

  // Pavé d'asphalte uni, orienté dans le sens de la piste.
  // La hauteur suit la courbe (p.y) ; l'assiette du pavé est
  // inclinée selon la pente (dévers) pour un rendu 3D crédible.
  const pave = bloc(CONFIG.largeurRoute, 0.3, PAS + 0.6, COULEUR_ROUTE, p.x, p.y + 0.05, p.z);
  pave.rotation.order = 'YXZ';                                    // yaw D'ABORD, pitch ensuite
  pave.rotation.y = angle;
  pave.rotation.x = Math.atan2(courbe.getTangentAt(t).y, 1) * -1; // inclinaison dans la pente
  groupeRoute.add(pave);

  // Bordures : une bande continue ÉPAISSE (0.7) légèrement en
  // retrait, suivie d'une fine bande blanche toute neuve → effet
  // « bord de route usé puis repeint », très lisible.
  for (const cote of [-1, 1]) {
    const bande = bloc(0.7, 0.06, PAS + 0.6, 0xD6D3CE,
      p.x + Math.cos(angle) * (demi - 0.45) * cote, p.y + HAUTEUR_ROUTE + 0.03,
      p.z - Math.sin(angle) * (demi - 0.45) * cote);
    bande.rotation.y = angle;
    groupeRoute.add(bande);
    const ligne = bloc(0.25, 0.06, PAS + 0.6, COULEUR_LIGNE,
      p.x + Math.cos(angle) * (demi - 1.1) * cote, p.y + HAUTEUR_ROUTE + 0.04,
      p.z - Math.sin(angle) * (demi - 1.1) * cote);
    ligne.rotation.y = angle;
    groupeRoute.add(ligne);
  }

  // Pointillés du milieu : traits blancs nets, allongés
  // (1.8 au lieu de 1.2) et posés en quinconce léger pour un
  // rendu régulier du pointillé le long de la courbe.
  if (i % 2 === 0) {
    const milieu = bloc(0.35, 0.06, 1.8, COULEUR_LIGNE, p.x, p.y + HAUTEUR_ROUTE + 0.04, p.z);
    milieu.rotation.y = angle;
    groupeRoute.add(milieu);
  }

}

/* --- Clôtures en bois le long de la route : surtout dans la
   section pré (serpentin) et autour de la zone des bosses.
   Barrières voxel : 2 piquets + 2 traverses par section, posées
   tous les 3 pavés. AUCUNE collision (décor pur) pour garder
   la conduite fluide — elles marquent visuellement les bords. */
function creerCloture(px, pz, py, angle) {
  const g = new THREE.Group();
  const BOIS = 0x8D6E63;
  const BOIS_SOMBRE = 0x6D4C41;
  for (const cote of [-1, 1]) {
    const bx = px + Math.cos(angle) * (demi + 1.2) * cote;
    const bz = pz - Math.sin(angle) * (demi + 1.2) * cote;
    g.add(bloc(0.35, 1.6, 0.35, BOIS_SOMBRE, bx, py + 0.8, bz));          // piquets
    g.add(bloc(0.12, 0.18, 3.2, BOIS, bx, py + 1.25, bz));                 // traverse haute
    g.add(bloc(0.12, 0.18, 3.2, BOIS, bx, py + 0.7, bz));                  // traverse basse
  }
  return g;
}
/* Clôtures sur les sections : pré (serpentin S) et zone des
   bosses. Indices ciblés dans la zone correspondante du tracé. */
const SECTIONS_CLOTURES = [
  [Math.floor(NB_ECHANTILLONS * 0.26), Math.floor(NB_ECHANTILLONS * 0.46)],  // serpentin pré
  [Math.floor(NB_ECHANTILLONS * 0.62), Math.floor(NB_ECHANTILLONS * 0.88)],  // bosses
];
for (const [debut, fin] of SECTIONS_CLOTURES) {
  for (let i = debut; i < fin; i += 3) {
    const t = i / NB_ECHANTILLONS;
    const p = courbe.getPointAt(t);
    const tang = courbe.getTangentAt(t);
    const angle = Math.atan2(tang.x, tang.z);
    const cl = creerCloture(p.x, p.z, p.y, angle);
    cl.rotation.y = angle;
    scene.add(cl);
  }
}

/* --- Ligne de départ/arrivée en damier (au début de la boucle) --- */
const depart = echantillons[0];
const angleDepart = Math.atan2(tangentes[0].x, tangentes[0].z);
const ligneDepart = new THREE.Group();
for (let i = 0; i < 10; i++) {
  const couleur = (i % 2 === 0) ? 0x111111 : 0xEEEEEE;
  const carreau = bloc(CONFIG.largeurRoute / 10, 0.06, 1.2, couleur,
    -demi + CONFIG.largeurRoute / 20 + i * CONFIG.largeurRoute / 10,
    HAUTEUR_ROUTE + 0.04, 0);
  ligneDepart.add(carreau);
}
ligneDepart.position.set(depart.x, 0, depart.z);
ligneDepart.rotation.y = angleDepart;
groupeRoute.add(ligneDepart);

scene.add(groupeRoute);

/* =========================================================
   2ter. ZONES D'ACCÉLÉRATION (boost pads, façon Mario Kart)
   Des panneaux orange vif posés SUR la route avec des
   chevrons blancs qui indiquent le sens. On roule dessus →
   accélération instantanée pendant ~1 seconde.
   Placés au début d'une ligne droite : on sort du boost
   avec de l'élan pour attaquer la droite qui suit.
   ========================================================= */
const zonesBoost = [];
function creerZoneBoost(indice) {
  const p = echantillons[indice];
  const tangente = tangentes[indice];
  const angle = Math.atan2(tangente.x, tangente.z);

  const zone = new THREE.Group();
  // Plateau orange vif légèrement au-dessus de la route (repérable au premier coup d'œil)
  zone.add(bloc(CONFIG.largeurRoute * 0.6, 0.06, 6, 0xFF8F00, 0, HAUTEUR_ROUTE + 0.04, 0));
  // Chevrons blancs : 3 rangées de flèches pointant dans le sens de la course
  for (let rangée = 0; rangée < 3; rangée++) {
    const z = -2 + rangée * 2;
    for (const cote of [-1, 1]) {
      const chevron = bloc(1.4, 0.06, 0.5, 0xFFFFFF, cote * 2.2, HAUTEUR_ROUTE + 0.07, z);
      chevron.rotation.y = cote * 0.5; // incliné pour former le V du chevron
      zone.add(chevron);
    }
  }
  zone.position.set(p.x, 0, p.z);
  zone.rotation.y = angle;
  scene.add(zone);

  // Enregistre la zone pour la détection : position monde + rayon
  zonesBoost.push({ x: p.x, z: p.z, rayon: CONFIG.largeurRoute * 0.3 });
}

// Deux panneaux : à 20% du circuit (attaque de la grande droite)
// et à 60% (relance avant l'épingle). Indices fixes → toujours
// aux mêmes endroits, pile sur la route.
creerZoneBoost(Math.floor(NB_ECHANTILLONS * 0.20));
creerZoneBoost(Math.floor(NB_ECHANTILLONS * 0.60));

/* --- TREMPLINS : entre les deux zones d'accélération (40% et
   80% du circuit). Même taille que les accélérateurs (60% de la
   largeur de route, 6 blocs de long), mais en RAMPE : des blocs
   violets empilés en escalier + une bande rouge au sommet, bien
   distinguables de la route et des pads orange.
   On passe dessus en avançant → décollage, vol balistique
   (montée puis descente progressives), et BOOST à l'atterrissage. */
const tremplins = [];
const TREMPLIN_LONGUEUR = 12;                    // rampe bien plus longue : on grimpe dessus avant de décoller
const TREMPLIN_LARGEUR = CONFIG.largeurRoute * 0.45; // moins large : il faut viser un peu
function creerTremplin(indice) {
  const p = echantillons[indice];
  const tangente = tangentes[indice];
  const angle = Math.atan2(tangente.x, tangente.z);

  const tremplin = new THREE.Group();
  // ATTENTION au sens de course : on roule À L'INVERSE de la
  // tangente (voir cap = atan2(-t, -t)). La rampe est donc
  // construite « à l'envers » : la plus BASSE marche est du côté
  // tangent (+z local) où on arrive, et les marches montent vers
  // -z local, le sens de course. Bande rouge = sommet = décollage.
  const NB_MARCHES = 8;
  const hauteurMax = 0.9;
  for (let m = 0; m < NB_MARCHES; m++) {
    const profondeurMarche = TREMPLIN_LONGUEUR / NB_MARCHES;
    const hauteurMarche = (hauteurMax / NB_MARCHES) * (m + 1);
    // m=0 → marche la plus basse, posée au bout +z (côté arrivée)
    tremplin.add(bloc(TREMPLIN_LARGEUR, hauteurMarche, profondeurMarche + 0.05,
      0x7B1FA2, 0, hauteurMarche / 2, TREMPLIN_LONGUEUR / 2 - profondeurMarche / 2 - m * profondeurMarche));
  }
  // Bande rouge vive au sommet de la rampe : le point de décollage
  tremplin.add(bloc(TREMPLIN_LARGEUR, 0.1, 0.8, 0xFF1744,
    0, hauteurMax + 0.05, -TREMPLIN_LONGUEUR / 2 + 0.4));
  tremplin.position.set(p.x, 0, p.z);
  tremplin.rotation.y = angle;
  scene.add(tremplin);

  // Décollage au SOMMET de la rampe, dans le SENS DE COURSE
  // (inverse de la tangente) : la voiture remonte toute la
  // rampe puis saute au niveau de la bande rouge.
  const sx = p.x - tangente.x * (TREMPLIN_LONGUEUR / 2 - 1);
  const sz = p.z - tangente.z * (TREMPLIN_LONGUEUR / 2 - 1);
  tremplins.push({ x: sx, z: sz, rayon: 2.2 });
}

creerTremplin(Math.floor(NB_ECHANTILLONS * 0.40));
creerTremplin(Math.floor(NB_ECHANTILLONS * 0.80));

/* =========================================================
   3. LE DÉCOR : ARBRES, MAISONS ET VACHES
   Posés autour du circuit, jamais dessus.
   ========================================================= */
function creerArbre(x, z) {
  const arbre = new THREE.Group();
  arbre.position.y = hauteurTerrain(x, z); // posé sur la prairie vallonnée
  arbre.add(bloc(0.7, 2.2, 0.7, 0x6E4419, 0, 1.1, 0));
  const vert = [0x2E7D32, 0x388E3C, 0x43A047][Math.floor(Math.random() * 3)];
  arbre.add(bloc(2.6, 1.0, 2.6, vert, 0, 2.7, 0));
  arbre.add(bloc(1.8, 0.9, 1.8, vert, 0, 3.6, 0));
  arbre.position.set(x, 0, z);
  enregistrerObstacle(x, z, 0.9, 'solide', arbre); // tronc
  return arbre;
}

function creerMaison(x, z, ry) {
  const maison = new THREE.Group();
  maison.position.y = hauteurTerrain(x, z); // posée sur la prairie vallonnée
  const murs = [0xD7C49E, 0xCBB994, 0xDEB887][Math.floor(Math.random() * 3)];
  maison.add(bloc(4.5, 3, 4.5, murs, 0, 1.5, 0));
  maison.add(bloc(5.2, 0.6, 5.2, 0xB71C1C, 0, 3.3, 0));
  maison.add(bloc(4.0, 0.6, 4.0, 0xB71C1C, 0, 3.9, 0));
  maison.add(bloc(2.6, 0.6, 2.6, 0xB71C1C, 0, 4.5, 0));
  maison.add(bloc(1.0, 1.6, 0.15, 0x5D4037, 0, 0.8, 2.3));
  maison.add(bloc(1.0, 1.0, 0.15, 0x81D4FA, -1.5, 1.8, 2.3));
  maison.add(bloc(1.0, 1.0, 0.15, 0x81D4FA, 1.5, 1.8, 2.3));
  maison.position.set(x, 0, z);
  maison.rotation.y = ry;
  enregistrerObstacle(x, z, 2.8, 'solide', maison); // murs + toit
  return maison;
}

/* Une vache Minecraft : corps blanc à taches, tête, cornes */
function creerVache(x, z) {
  const vache = new THREE.Group();
  vache.position.y = hauteurTerrain(x, z);  // posée sur la prairie vallonnée (fix flottantes)
  vache.add(bloc(1.4, 1.0, 2.4, 0xF5F5F5, 0, 1.3, 0));          // corps
  // Taches noires : fines plaques POSÉES SUR la peau (flancs,
  // dos, arrière-train), en nombre suffisant pour un pelage
  // bien tacheté — et légèrement en relief (±0.02) pour éviter
  // tout scintillement de surface coplanaire.
  const NOIR = 0x37474F;
  vache.add(bloc(0.06, 0.55, 0.9, NOIR, -0.72, 1.35, 0.3));   // flanc gauche
  vache.add(bloc(0.06, 0.4, 0.7, NOIR, -0.72, 1.15, -0.6));  // flanc gauche 2
  vache.add(bloc(0.06, 0.45, 0.8, NOIR, 0.72, 1.25, -0.4));  // flanc droit
  vache.add(bloc(0.06, 0.35, 0.6, NOIR, 0.72, 1.45, 0.6));   // flanc droit 2
  vache.add(bloc(0.55, 0.06, 0.85, NOIR, -0.15, 1.82, 0.35)); // dos
  vache.add(bloc(0.4, 0.06, 0.6, NOIR, 0.3, 1.82, -0.5));    // dos 2
  vache.add(bloc(0.65, 0.55, 0.06, NOIR, 0.2, 1.4, 1.22));   // arrière-train
  vache.add(bloc(0.8, 0.8, 0.7, 0xF5F5F5, 0, 1.8, -1.5));      // tête
  vache.add(bloc(0.55, 0.45, 0.1, 0xFFCDD2, 0, 1.7, -1.9));     // museau
  vache.add(bloc(0.15, 0.15, 0.3, 0x8D6E63, -0.3, 2.25, -1.5)); // corne
  vache.add(bloc(0.15, 0.15, 0.3, 0x8D6E63, 0.3, 2.25, -1.5));  // corne
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, -0.45, 0.5, -0.8)); // pattes
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, 0.45, 0.5, -0.8));
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, -0.45, 0.5, 0.8));
  vache.add(bloc(0.25, 1.0, 0.25, 0x37474F, 0.45, 0.5, 0.8));
  vache.position.set(x, 0, z);
  vache.rotation.y = Math.random() * Math.PI * 2;
  const obs = enregistrerObstacle(x, z, 1.2, 'vache', vache); // corps (poussable)
  // Vie de la vache : mini machine à états idle/walk
  obs.etat = 'idle';
  obs.minuteur = 2 + Math.random() * 8;      // secondes avant le prochain changement
  obs.capMarche = vache.rotation.y;          // cap actuel de marche
  obs.phaseBroute = Math.random() * Math.PI * 2; // décale le broutement de chaque vache
  return vache;
}

/* Un point est-il trop près de la piste ? (pour ne pas
   poser le décor dessus) */
function distanceALaPiste(x, z) {
  let min = Infinity;
  for (let i = 0; i < NB_ECHANTILLONS; i += 3) {
    const dx = echantillons[i].x - x;
    const dz = echantillons[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < min) min = d;
  }
  return Math.sqrt(min);
}

/* ---------- HERBE DÉTAILLÉE HORS PISTE (InstancedMesh) ----------
   Des brins low-poly semés partout SAUF sur la piste : le joueur
   voit d'un coup d'œil que l'herbe « broussailleuse » est la
   zone qui ralentit, par opposition à la route lisse.
   PERF : tout est regroupé dans UN SEUL InstancedMesh → 1 draw
   call pour ~2000 brins (au lieu de ~350 meshes individuels
   avant, pour 4x moins de brins). Couleur et ondulation « vent »
   gérées par instance dans le vertex shader (onBeforeCompile) :
   chaque brin penche légèrement selon sa position et le temps.
   Pour changer la densité : modifier NB_BRINS ci-dessous. */
const COULEURS_TOUFFE = [0x6B9E47, 0x8BC34A, 0x9BBF4E, 0xC9D46A];
const NB_BRINS = 2000;        // densité de l'herbe
const FLEURS = true;           // mini-fleurs semées par-ci par-là
const uniformTemps = { value: 0 }; // temps écoulé, partagé avec le shader d'herbe

// matériau avec couleurs PAR INSTANCE (instanceColor)
const matHerbe = new THREE.MeshLambertMaterial();
matHerbe.onBeforeCompile = (shader) => {
  shader.uniforms.uTemps = uniformTemps;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `
      #include <common>
      uniform float uTemps;`) // temps écoulé pour l'ondulation
    // Ondulation : on incline le haut du brin (position.y > 0 dans
    // l'espace du cube unitaire étiré par la matrice d'instance)
    // d'une oscillation sinusoïdale propre à chaque brin (phase =
    // position du brin) → effet de vent léger, quasi gratuit.
    .replace('#include <begin_vertex>', `
      #include <begin_vertex>
      float phase = instanceMatrix[3].x * 1.7 + instanceMatrix[3].z * 2.3;
      float souffle = sin(uTemps * 2.0 + phase) * 0.12;
      transformed.x += souffle * max(position.y, 0.0) * 2.0;
      transformed.z += souffle * 0.6 * max(position.y, 0.0) * 2.0;`);
};

// 1) On sème d'abord les positions (hors piste), puis on remplit
//    les buffers de matrices/couleurs du InstancedMesh.
const brins = [];
for (let i = 0; brins.length < NB_BRINS; i++) {
  const x = 6 + (Math.random() - 0.5) * 350;
  const z = -4 + (Math.random() - 0.5) * 350;
  // pas d'herbe sur la piste ni juste à côté (zone roulable nette)
  if (distanceALaPiste(x, z) < demi + 2.5) continue;
  const hauteur = 0.25 + Math.random() * 0.5;  // hauteurs très variées

const ÉCHELLE_POULE = 1.25; // grosses poules bien visibles

function creerPoule(couleurCorps, couleurAile, x, z, souplesse) {

  // barbillon rouge sous le bec
  poule.add(bloc(0.12, 0.16, 0.12, 0xD32F2F, 0, 0.68, -0.68));
  // bec orange + yeux noirs
  poule.add(bloc(0.14, 0.14, 0.3, 0xF57C00, 0, 0.85, -0.72));
  poule.add(bloc(0.06, 0.1, 0.1, 0x111111, -0.26, 1.02, -0.62));
  poule.add(bloc(0.06, 0.1, 0.1, 0x111111, 0.26, 1.02, -0.62));
  // ailes légèrement plus sombres + queue relevée
  poule.add(bloc(0.12, 0.45, 0.65, couleurAile, -0.47, 0.42, 0.05));
  poule.add(bloc(0.12, 0.45, 0.65, couleurAile, 0.47, 0.42, 0.05));
  poule.add(bloc(0.4, 0.4, 0.25, couleurAile, 0, 0.62, 0.55));
  // pattes oranges
  poule.add(bloc(0.1, 0.28, 0.1, 0xF57C00, -0.2, 0.14, 0.1));
  poule.add(bloc(0.1, 0.28, 0.1, 0xF57C00, 0.2, 0.14, 0.1));

  poule.scale.setScalar(ÉCHELLE_POULE);
  poule.position.set(x, HAUTEUR_ROUTE + 0.72, z); // posée sur le plancher de la benne
  // état pour l'inertie : chaque poule a sa souplesse → elles ne
  // basculent jamais exactement en même temps, effet plus vivant
  poule.inertie = 0;         // inclinaison actuelle (lissée)
  poule.xBase = x;           // position de repos dans la benne
  poule.souplesse = souplesse; // vitesse de réaction au virage
  poule.phase = Math.random() * Math.PI * 2; // décale le picorage idle
  poules.push(poule);
  pickup.add(poule);
}

/* ---------- CHRONO DE TOUR ----------
   Le chrono démarre dès qu'on avance, puis à chaque
   franchissement de la ligne de damier on mémorise le
   temps du tour écoulé. Le MEILLEUR est sauvegardé dans
   localStorage (il reste même après rechargement).
   Format : MM:SS:CC (minutes : secondes : centièmes) */
const chronoElt = document.getElementById('chrono');
let debutTour = null; // timestamp du début du tour en cours
let dernierTour = null;  // temps du tour PRÉCÉDENT (affiché DERNIER)
let meilleurTour = parseFloat(localStorage.getItem('meilleurTour')) || null;

function formaterTemps(ms) {
  if (ms == null) return '00:00:00';
  const minutes = Math.floor(ms / 60000);
  const secondes = Math.floor((ms % 60000) / 1000);
  const centiemes = Math.floor((ms % 1000) / 10);
  const p = n => String(n).padStart(2, '0');
  return p(minutes) + ':' + p(secondes) + ':' + p(centiemes);
}

function majChrono(ms) {
  chronoElt.textContent = 'TOUR : ' + formaterTemps(ms)
    + '\nDERNIER : ' + formaterTemps(dernierTour)
    + '\nMEILLEUR : ' + formaterTemps(meilleurTour);
}

/* =========================================================
   5. CLAVIER + KLAXON CANARD
   ========================================================= */
const touches = {};

/* ---------- PAUSE (touche Échap) ----------
   Le jeu se fige : plus de mise à jour, plus de chrono qui
   tourne (on note le décalage pour ne pas fausser le tour
   en cours). Appuyer à nouveau sur Échap reprend. */
let enPause = false;
let decalagePause = 0; // temps de pause à déduire du chrono
const pauseElt = document.createElement('div');
pauseElt.id = 'pause';
pauseElt.textContent = '⏸ PAUSE — appuie sur Échap pour reprendre';
document.body.appendChild(pauseElt);

function basculerPause() {
  enPause = !enPause;
  pauseElt.style.display = enPause ? 'block' : 'none';
  if (enPause) {
    pauseElt.debut = performance.now();
    // évite que la voiture reste « bloquée » sur des touches
    for (const k in touches) touches[k] = false;
  } else if (pauseElt.debut) {
    decalagePause += performance.now() - pauseElt.debut;
  }
}

addEventListener('keydown', e => {
  if (e.key === 'Escape') { basculerPause(); return; }
  if (e.key.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  touches[e.code] = true;
  if (e.code === 'Space') klaxonCanard();
});
addEventListener('keyup', e => { touches[e.code] = false; });

/* ---------- CONTRÔLES TACTILES (mobile uniquement) ----------
   On écrit directement dans `touches` avec les mêmes codes que
   le clavier ("ArrowUp", ...) : la conduite n'a pas besoin de
   savoir si l'input vient du clavier ou du doigt. */

/* Détection mobile : on combine plusieurs indices fiables.
   - matchMedia('(pointer: coarse)') : le pointeur principal est un doigt
   - 'ontouchstart' : l'écran tactile existe vraiment
   - largeur <= 820px : téléphone ou tablette en portrait
   On garde le clavier sur desktop, même si un écran tactile y est branché,
   car pointer: fine + grand écran = desktop. */
const pointerGrossier = matchMedia('(pointer: coarse)').matches;
const aTactile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
/* Un pointeur « doigt » (pointer: coarse) suffit : c'est le signal
   le plus fiable, même sur tablette en paysage. Le écran tactile +
   grande largeur sert de secours ; la condition de taille ne
   s'applique qu'au cas tactile seul, pour ne pas classer un
   desktop tactile (souris + écran connecté) en mobile. */
const estMobile = pointerGrossier || (aTactile && Math.min(innerWidth, innerHeight) <= 1024);

function appliquerModeMobile() {
  document.body.classList.toggle('mobile', estMobile);
  // Anti scroll/zoom UNIQUEMENT quand les contrôles tactiles sont actifs :
  // sur desktop on ne touche à rien, la page reste normale.
  document.addEventListener('touchmove', bloquerTactile, { passive: false });
  document.addEventListener('gesturestart', bloquerTactile, { passive: false });
  document.addEventListener('dblclick', bloquerTactile, { passive: false });
  bloquerTactile.actif = estMobile;
}
function bloquerTactile(e) {
  if (bloquerTactile.actif) e.preventDefault();
}
appliquerModeMobile();

if (estMobile) {
  // Chaque bouton presse la "touche" correspondante. pointerdown/pointerup
  // + setPointerCapture : ça marche au doigt, et le bouton reste "collé"
  // même si le doigt glisse un peu (comme une vraie manette).
  for (const btn of document.querySelectorAll('#tactile .btn')) {
    const code = btn.dataset.touche;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      if (code === 'Klaxon') { klaxonCanard(); return; }
      touches[code] = true;
    });
    btn.addEventListener('pointerup',   () => { if (code !== 'Klaxon') touches[code] = false; });
    btn.addEventListener('pointercancel',() => { if (code !== 'Klaxon') touches[code] = false; });
    // Sécurité : si le doigt sort du bouton, on relâche quand même
    btn.addEventListener('lostpointercapture', () => { touches[code] = false; });
  }
}

let ctxAudio = null;
/* Un petit "meuh" de vache quand on en pousse une */
function meuh() {
  if (meuh.dernier && performance.now() - meuh.dernier < 800) return; // anti-spam
  meuh.dernier = performance.now();
  if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctxAudio.currentTime;

  const osc = ctxAudio.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(140, t + 0.3);
  osc.frequency.linearRampToValueAtTime(110, t + 0.5);

  const filtre = ctxAudio.createBiquadFilter();
  filtre.type = 'lowpass';
  filtre.frequency.value = 700;

  const gain = ctxAudio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

  osc.connect(filtre);
  filtre.connect(gain);
  gain.connect(ctxAudio.destination);

  osc.start(t);
  osc.stop(t + 0.6);
}

function klaxonCanard() {
  if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctxAudio.currentTime;

  const osc = ctxAudio.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(250, t);
  osc.frequency.exponentialRampToValueAtTime(600, t + 0.08);
  osc.frequency.exponentialRampToValueAtTime(180, t + 0.25);

  const filtre = ctxAudio.createBiquadFilter();
  filtre.type = 'bandpass';
  filtre.frequency.value = 900;
  filtre.Q.value = 1.5;

  const gain = ctxAudio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(filtre);
  filtre.connect(gain);
  gain.connect(ctxAudio.destination);

  osc.start(t);
  osc.stop(t + 0.3);
}

/* =========================================================
   6bis. MISE À JOUR : CONDUITE SUR LE CIRCUIT
   La voiture a maintenant une vraie position (x, z) et un
   cap (angle). Les flèches gauche/droite font tourner le
   cap, la voiture avance dans sa direction. Si elle sort
   de la piste, elle ralentit dans l'herbe. Passer la
   ligne de damier = un tour de plus !
   ========================================================= */
// Position de départ : un peu AVANT la ligne de damier
// dans le sens de course. On roule dans le sens INVERSE
// du circuit (cap = tangente retournée), donc on démarre
// juste APRÈS l'indice 0 (la ligne) : en avançant à
// l'envers (indices qui diminuent), on franchit la ligne
// de damier tout de suite, puis on continue vers les
// indices élevés.
const INDICE_DEPART = 15;
const posDepart = echantillons[INDICE_DEPART];
const voiture = {
  x: posDepart.x,
  z: posDepart.z,
  directionLisse: 0,  // commande de direction lissée (inertie) : -1 .. 1
  tempsBoost: 0,      // temps de boost restant (0 = pas de boost)
  altitude: 0,         // hauteur actuelle pendant le vol (0 = au sol)
  vitesseVerticale: 0, // vitesse verticale pendant le vol
  enVol: false,       // vrai pendant un saut de tremplin
  tempsSpin: 0,       // temps restant de tour sur soi-même (choc de vache)
  capDeplacement: 0,  // cap de glissade pendant le spin (le châssis tourne, pas la trajectoire)
  derniereFrame: null,
  cap: Math.atan2(-tangentes[INDICE_DEPART].x, -tangentes[INDICE_DEPART].z), // sens inverse !
  vitesse: 0,
  surPiste: true,
  hauteurRoute: 0,    // altitude de la route sous la voiture (terrain vallonné)
  dernierIndice: INDICE_DEPART, // pour compter les tours
};

// Trouve le point de la piste le plus proche de la voiture
function pointLePlusProche(x, z) {
  let min = Infinity, indice = 0;
  // recherche locale autour du dernier indice connu (rapide,
  // symétrique car on roule dans les deux sens)
  for (let delta = -60; delta <= 60; delta++) {
    const i = (voiture.dernierIndice + delta + NB_ECHANTILLONS) % NB_ECHANTILLONS;
    const dx = echantillons[i].x - x;
    const dz = echantillons[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < min) { min = d; indice = i; }
  }
  return { indice, distance: Math.sqrt(min) };
}

/* =========================================================
   MINI-CARTE (haut à gauche)
   Canvas 2D : le tracé du circuit est dessiné UNE FOIS dans
   un canvas offscreen, puis à chaque frame on ne redessine
   que la flèche de la voiture (clear + copie du tracé +
   triangle rouge) → coût quasi nul.
   ========================================================= */
const carte = document.getElementById('minimap');
const ctxCarte = carte.getContext('2d');
const TAILLE_CARTE = 150;

const marge = 12; // pixels entre le tracé et le bord de la carte

/* Orientation de la carte : on veut la ligne d'arrivée sur la
   DROITE et la voiture qui remonte au départ. Une rotation de
   la vue de 60° donne exactement ça (calculée sur le tracé
   réel). On précalcule bornes et cos/sin une seule fois. */
const ANGLE_CARTE = 60 * Math.PI / 180;
const COS_CARTE = Math.cos(ANGLE_CARTE), SIN_CARTE = Math.sin(ANGLE_CARTE);
function versCarte(x, z) {
  // 1) base canvas : px = x, py = -z
  const bx = x, by = -z;
  // 2) rotation de ANGLE_CARTE (sens horaire canvas)
  const rx = bx * COS_CARTE - by * SIN_CARTE;
  const ry = bx * SIN_CARTE + by * COS_CARTE;
  // 3) mise à l'échelle (bornes calculées sur les points tournés)
  return {
    px: marge + (rx - CARTES.minX) * CARTES.echelle,
    py: TAILLE_CARTE - marge - (ry - CARTES.minY) * CARTES.echelle,
  };
}
const CARTES = (() => {
  let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity;
  for (const p of echantillons) {
    const bx = p.x, by = -p.z;
    const rx = bx * COS_CARTE - by * SIN_CARTE;
    const ry = bx * SIN_CARTE + by * COS_CARTE;
    if (rx < mnX) mnX = rx; if (rx > mxX) mxX = rx;
    if (ry < mnY) mnY = ry; if (ry > mxY) mxY = ry;
  }
  const ech = (TAILLE_CARTE - marge * 2) / Math.max(mxX - mnX, mxY - mnY);
  return { minX: mnX, minY: mnY, echelle: ech };
})();

// Tracé pré-dessiné (offscreen)
const fondCarte = document.createElement('canvas');
fondCarte.width = TAILLE_CARTE; fondCarte.height = TAILLE_CARTE;
{
  const c = fondCarte.getContext('2d');
  c.fillStyle = 'rgba(0,0,0,0.45)';
  c.fillRect(0, 0, TAILLE_CARTE, TAILLE_CARTE);
  c.beginPath();
  echantillons.forEach((p, i) => {
    const { px, py } = versCarte(p.x, p.z);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  });
  c.closePath();
  c.lineWidth = 5; c.strokeStyle = '#5a5a66'; c.stroke(); // piste
  c.lineWidth = 1.5; c.strokeStyle = '#c8c8d0'; c.stroke(); // contour clair
  // Ligne de départ : petit trait blanc sur le 1er échantillon
  const d = echantillons[0];
  const { px, py } = versCarte(d.x, d.z);
  c.fillStyle = '#fff';
  c.fillRect(px - 3, py - 3, 6, 6);
}

function majMiniCarte() {
  ctxCarte.clearRect(0, 0, TAILLE_CARTE, TAILLE_CARTE);
  ctxCarte.drawImage(fondCarte, 0, 0);
  const { px, py } = versCarte(voiture.x, voiture.z);
  ctxCarte.save();
  ctxCarte.translate(px, py);
  ctxCarte.rotate(-voiture.cap); // le canvas tourne horaire, le monde antihoraire
  ctxCarte.fillStyle = '#E53935'; // rouge du pickup
  ctxCarte.beginPath();
  ctxCarte.moveTo(0, -6);  // pointe
  ctxCarte.lineTo(4.5, 5);  // ailes
  ctxCarte.lineTo(-4.5, 5);
  ctxCarte.closePath();
  ctxCarte.fill();
  ctxCarte.restore();
}
majMiniCarte(); // premier affichage

/* ---------- VIVANT : LES VACHES BOUGENT ----------
   Mini machine à états par vache (dans le registre) :
   - idle : elle broute sur place (tête qui plonge doucement)
   - walk : elle marche lentement dans un cap aléatoire,
     mais JAMAIS si le pas l'approcherait de la piste
     (contrôle via distanceALaPiste avant d'appliquer).
   Les positions passent par le registre → les collisions
   voiture/vache restent exactes, même en mouvement. */
let dernierTempsVaches = performance.now();

function majVaches() {
  const maintenant = performance.now();
  const dt = Math.min((maintenant - dernierTempsVaches) / 1000, 0.05); // borne anti-saut
  dernierTempsVaches = maintenant;
  const t = maintenant / 1000;

  for (const obs of obstacles) {
    if (obs.type !== 'vache' || !obs.etat) continue;
    obs.minuteur -= dt;

    if (obs.etat === 'idle') {
      // Broutement : la vache plonge doucement la tête à son rythme
      const plongee = Math.max(0, Math.sin(t * 1.5 + obs.phaseBroute)) * 0.18;
      obs.mesh.rotation.x = plongee;
      // Fin d'idle → une chance sur deux de se remettre à marcher
      if (obs.minuteur <= 0) {
        obs.etat = 'walk';
        obs.capMarche = obs.mesh.rotation.y + (Math.random() - 0.5) * 2.5;
        obs.minuteur = 1 + Math.random() * 2; // marche 1 à 3 s
      }
    } else { // walk
      const pas = 0.5 * dt; // vitesse lente
      const nx = obs.x + Math.sin(obs.capMarche) * pas;
      const nz = obs.z + Math.cos(obs.capMarche) * pas;
      // Les vaches peuvent maintenant aller partout, y compris
      // sur la route (plus de restriction anti-route).
      obs.x = nx; obs.z = nz;
      obs.mesh.position.set(nx, 0, nz);
      // rotation douce vers le cap de marche
      const diff = obs.capMarche - obs.mesh.rotation.y;
      obs.mesh.rotation.y += diff * Math.min(1, dt * 3);
      if (obs.minuteur <= 0) {
        obs.etat = 'idle';
        obs.minuteur = 3 + Math.random() * 7;
      }
    }
  }
}

function update() {
  // BOOST : si on roule sur un panneau d'accélération, la vitesse
  // saute instantanément à boostVitesse pendant boostDuree s.
  // Déclenché seulement si on avance (pas de boost à l'arrêt ni
  // en marche arrière), et le plafond de vitesse est relevé
  // tant que le boost est actif.
  const maintenant = performance.now();
  const dtFrame = Math.min((maintenant - (voiture.derniereFrame ?? maintenant)) / 1000, 0.05);
  voiture.derniereFrame = maintenant;
  if (voiture.tempsBoost > 0) {
    voiture.tempsBoost -= dtFrame;
  }
  for (const zb of zonesBoost) {
    const dx = voiture.x - zb.x;
    const dz = voiture.z - zb.z;
    if (voiture.vitesse > 0 && dx * dx + dz * dz < zb.rayon * zb.rayon) {
      voiture.vitesse = CONFIG.boostVitesse;
      voiture.tempsBoost = CONFIG.boostDuree;
      break;
    }
  }

  // SPIN (choc de vache) : la voiture tourne sur elle-même —
  // le cap balaie un tour complet en spinDuree secondes, la
  // vitesse est amortie pendant la vrille. Une fois fini, on
  // repart dans le sens d'origine (360° = retour au même cap).
  if (voiture.tempsSpin > 0) {
    voiture.tempsSpin -= dtFrame;
    voiture.cap += (CONFIG.spinTours * Math.PI * 2 / CONFIG.spinDuree) * dtFrame;
    // On garde une vitesse de glissade : la voiture continue
    // de s'ÉLOIGNER de la vache pendant la vrille (sinon on
    // reste dessus et on la re-percute en boucle).
    voiture.vitesse = CONFIG.vitesseMax * 0.6;
  }

  // TREMPLINS : décollage, vol balistique, boost à l'atterrissage.
  // Au sol, on teste si on roule sur un tremplin (en avançant) →
  // impulsion verticale. En vol, la gravité tire progressivement
  // vers le bas : montée douce puis redescente douce (~1.2 s).
  // À l'atterrissage (altitude repasse sous 0) : boost de relance.
  if (!voiture.enVol) {
    for (const tr of tremplins) {
      const dx = voiture.x - tr.x;
      const dz = voiture.z - tr.z;
      if (voiture.vitesse > 0 && dx * dx + dz * dz < tr.rayon * tr.rayon) {
        voiture.enVol = true;
        voiture.vitesseVerticale = CONFIG.tremplinVitesseVerticale;
        voiture.tempsBoost = 0; // le boost en cours est remplacé par le vol
        break;
      }
    }
  } else {
    // physique du vol : la vitesse verticale diminue avec la gravité,
    // l'altitude suit. Fluide et indépendant du frame-rate.
    voiture.vitesseVerticale -= CONFIG.tremplinGravite * dtFrame;
    voiture.altitude += voiture.vitesseVerticale * dtFrame;
    if (voiture.altitude <= 0) {
      // Atterrissage : retour au sol + boost de relance bien marqué
      voiture.altitude = 0;
      voiture.enVol = false;
      voiture.vitesseVerticale = 0;
      voiture.vitesse = CONFIG.tremplinBoostAtterrissage; // ~2x la vitesse max
      voiture.tempsBoost = CONFIG.boostDuree;
    }
  }

  // Accélérer / freiner / ralentir — SAUF pendant le boost : la
  // pédale de gaz normal plafonne à vitesseMax, ce qui écraserait
  // instantanément le boost. Pendant le boost, la vitesse est
  // gérée uniquement par le chrono du boost (et le frein reste
  // dispo pour l'annuler si besoin).
  if (voiture.tempsBoost <= 0) {
    if (touches['ArrowUp'])   voiture.vitesse = Math.min(CONFIG.vitesseMax, voiture.vitesse + CONFIG.acceleration);
    if (touches['ArrowDown']) voiture.vitesse = Math.max(-CONFIG.vitesseMax * 0.5, voiture.vitesse - CONFIG.freinage);
    if (!touches['ArrowUp'] && !touches['ArrowDown']) {
      if (voiture.vitesse > 0) voiture.vitesse = Math.max(0, voiture.vitesse - CONFIG.ralentissement);
      if (voiture.vitesse < 0) voiture.vitesse = Math.min(0, voiture.vitesse + CONFIG.ralentissement);
    }
  } else if (touches['ArrowDown']) {
    voiture.tempsBoost = 0;  // freiner pendant le boost l'annule
  }

  // Tourner : la commande de direction est LISSÉE (inertie).
  // Au lieu d'appliquer le virage à fond dès la première frame,
  // la consigne (-1, 0 ou +1) est filtrée : elle monte doucement
  // quand on appuie (~0.3 s pour atteindre le maximum) et
  // redescend doucement quand on relâche. Résultat : le pickup
  // prend son virage progressivement, comme une vraie voiture,
  // au lieu de pivoter instantanément.
  const facteurVitesse = Math.abs(voiture.vitesse) / CONFIG.vitesseMax; // on tourne moins à l'arrêt
  const consigne = (touches['ArrowLeft'] ? 1 : 0) + (touches['ArrowRight'] ? -1 : 0);
  const vers = consigne !== 0 ? CONFIG.vitesseMonteeVirage : CONFIG.vitesseDescenteVirage;
  // interpolation exponentielle vers la consigne (lissée, frame-rate indépendante)
  voiture.directionLisse += (consigne - voiture.directionLisse) * Math.min(1, vers * dtFrame);
  if (Math.abs(voiture.directionLisse) < 0.001) voiture.directionLisse = 0; // évite le résidu infinitésimal
  const direction = voiture.directionLisse;
  voiture.cap += direction * CONFIG.vitesseVirage * (voiture.vitesse >= 0 ? 1 : -1) * facteurVitesse;

  // Avancer : pendant le spin, la trajectoire reste droite
  // (capDeplacement) alors que le châssis tourne sur lui-même.
  const capDeplacement = voiture.tempsSpin > 0 ? voiture.capDeplacement : voiture.cap;
  voiture.x += Math.sin(capDeplacement) * voiture.vitesse;
  voiture.z += Math.cos(capDeplacement) * voiture.vitesse;

  // --- COLLISIONS ---
  // La voiture est un cercle (rayon 1.8). Contre un obstacle
  // SOLIDE (barrière, maison, arbre) : on est repoussé le long
  // de la normale et la vitesse est amortie (rebond doux,
  // jamais de blocage violent). Contre une VACHE : c'est la
  // vache qui se fait pousser (option A) + petit meuh !
  const RAYON_VOITURE = 1.2; // resserré : la voiture ne doit être freinée qu'au vrai contact
  for (const obs of obstacles) {
    const dx = voiture.x - obs.x;
    const dz = voiture.z - obs.z;
    const distMin = RAYON_VOITURE + obs.rayon;
    const d2 = dx * dx + dz * dz;
    if (d2 < distMin * distMin) {
      const d = Math.sqrt(d2) || 0.001; // évite la division par zéro
      const nx = dx / d, nz = dz / d;   // normale du contact

      if (obs.type === 'vache') {
        // OPTION A : la vache glisse doucement devant la voiture
        const poussee = distMin - d;
        obs.x -= nx * poussee;
        obs.z -= nz * poussee;
        obs.mesh.position.set(obs.x, 0, obs.z);
        voiture.vitesse *= 0.5; // le choc freine nettement
        // TOUR SUR SOI-MÊME façon Mario Kart : le pickup part
        // en toupie pendant spinDuree secondes (un tour complet).
        if (voiture.tempsSpin <= 0) {
          voiture.tempsSpin = CONFIG.spinDuree;
          voiture.capDeplacement = voiture.cap; // on glisse tout droit pendant la vrille
        }
        meuh();
      } else {
        // SOLIDE — APPROCHE A (glissement) :
        // 1) on repositionne sur la surface avec une petite marge
        //    (+0.05) pour ne pas re-collider à chaque frame
        const poussee = distMin - d + 0.05;
        voiture.x += nx * poussee;
        voiture.z += nz * poussee;
        // 2) on ne supprime que la composante de la vitesse qui
        //    pointe VERS l'obstacle (produit scalaire avec la
        //    normale). La composante tangentielle est conservée :
        //    la voiture GLISSE le long du mur au lieu de rebondir.
        const vx = Math.sin(voiture.cap) * voiture.vitesse;
        const vz = Math.cos(voiture.cap) * voiture.vitesse;
        const versObstacle = -(vx * nx + vz * nz); // >0 si on fonce dessus
        if (versObstacle > 0) {
          // retire la part qui rentre dans l'obstacle
          const nvx = vx + nx * versObstacle;
          const nvz = vz + nz * versObstacle;
          // léger frottement au contact : frotter un mur coûte un peu
          voiture.vitesse = Math.sign(voiture.vitesse) * Math.hypot(nvx, nvz) * 0.98;
        }
      }
    }
  }

  // Suis-je sur la piste ? (assez près du centre de la courbe)
  const proche = pointLePlusProche(voiture.x, voiture.z);
  voiture.dernierIndice = proche.indice;
  voiture.surPiste = proche.distance < demi + 1.2;
  // HAUTEUR SOUS LA VOITURE (fix élévation) :
  // - sur la piste : hauteur INTERPOLÉE sur le segment de piste
  //   (plus de paliers d'escalier entre les échantillons) ;
  // - hors piste : hauteur du TERRAIN vallonné (herbe), pour
  //   que la voiture suive les collines au lieu de flotter ;
  // - en vol (tremplin) : on n'y touche pas, la balistique gère.
  if (!voiture.enVol) {
    const cible = voiture.surPiste
      ? hauteurPiste(voiture.x, voiture.z, proche.indice).hauteur
      : hauteurTerrain(voiture.x, voiture.z);
    // lissage doux : pas de saut sec quand on change de surface
    voiture.hauteurRoute += (cible - voiture.hauteurRoute) * 0.35;
  }

  // Dans l'herbe : la vitesse est limitée (et on ralentit vite)
  const vitessePlafond = voiture.tempsBoost > 0
    ? CONFIG.boostVitesse  // boost actif : plafond temporairement relevé
    : (voiture.surPiste ? CONFIG.vitesseMax : CONFIG.vitesseHerbe);
  if (voiture.vitesse > vitessePlafond) {
    voiture.vitesse = Math.max(vitessePlafond, voiture.vitesse - 0.02);
  }

  // Compteur de tours : franchir la ligne de damier.
  // Sens inverse : on passe du début de la boucle (indices
  // proches de 0) vers sa fin (indices proches du max)
  const ancien = update.dernierIndice ?? INDICE_DEPART;
  if (ancien < NB_ECHANTILLONS * 0.2 && voiture.dernierIndice > NB_ECHANTILLONS * 0.8 && voiture.vitesse > 0) {
    numTour++;
    tourElt.textContent = `🏁 Tour ${numTour}`;

    // Chrono : ligne franchie. La PREMIÈRE fois, on démarre
    // le chrono du tour 1 ; ensuite on mémorise le temps du
    // tour fini et on garde le MEILLEUR
    const maintenant = performance.now();
    if (debutTour !== null) {
      const duree = maintenant - debutTour - decalagePause;
      dernierTour = duree; // le tour fini devient le DERNIER
      if (meilleurTour === null || duree < meilleurTour) {
        meilleurTour = duree;
        localStorage.setItem('meilleurTour', String(duree));
      }
    }
    debutTour = maintenant; // nouveau tour : le chrono repart
    decalagePause = 0; // repart sans décalage pour le tour suivant
  }

  // Affichage du chrono. Avant la ligne de départ il reste
  // à 00:00:00 : il ne démarre qu'au premier franchissement.
  // Le temps de pause est déduit pour ne pas fausser le tour.
  majChrono(debutTour === null ? 0 : performance.now() - debutTour - decalagePause);
  majVaches(); // vaches vivantes (marche + broutement)
  majMiniCarte(); // flèche voiture sur la mini-carte
  update.dernierIndice = voiture.dernierIndice;


  // Placer la voiture (légère inclinaison dans les virages)
  pickup.position.set(voiture.x, voiture.hauteurRoute + HAUTEUR_ROUTE + voiture.altitude, voiture.z);
  // En vol : petite inclinaison avant au décollage, puis retour à plat
  pickup.rotation.x += ((voiture.enVol ? -0.15 : 0) - pickup.rotation.x) * 0.15;
  pickup.rotation.y = voiture.cap + Math.PI; // l'avant du pickup regarde vers -z
  pickup.rotation.z = direction * 0.08 * facteurVitesse;

  // Inertie des poules : même force que l'inclinaison du pickup,
  // mais lissée par poule (souplement, jamais un basculement sec).
  // Virage à droite (direction=1) → la force les pousse vers la
  // gauche de la benne ; virage à gauche → vers la droite.
  const forceVirage = direction * facteurVitesse; // -1 .. 1
  const tMaintenant = performance.now() / 1000; // pour le petit picorage idle
  for (const poule of poules) {
    poule.inertie += (forceVirage - poule.inertie) * poule.souplesse;
    poule.rotation.z = poule.inertie * 0.4;              // bascule du corps
    poule.position.x = poule.xBase - poule.inertie * 0.14; // glissée dans la benne
    poule.rotation.x = Math.sin(tMaintenant * 2.5 + poule.phase) * 0.03; // petit picorage idle
  }

  // Nuages : dérive lente en altitude
  for (const n of nuages) {
    n.position.x += 0.01;
    if (n.position.x > 140) n.position.x = -140; // reboucle à l'autre bout
  }

  // Caméra de poursuite : derrière la voiture, dans son sens
  const hauteurCam = 4.5, distanceCam = 12;
  const cibleCam = new THREE.Vector3(voiture.x, voiture.hauteurRoute + 1.5 + voiture.altitude * 0.8, voiture.z);
  const capCam = voiture.tempsSpin > 0 ? voiture.capDeplacement : voiture.cap;
  const posCamVoulue = new THREE.Vector3(
    voiture.x - Math.sin(capCam) * distanceCam,
    voiture.hauteurRoute + hauteurCam,
    voiture.z - Math.cos(capCam) * distanceCam
  );
  camera.position.lerp(posCamVoulue, 0.08);
  camera.lookAt(cibleCam);
  // Effet de vitesse : pendant le boost, la caméra élargit son
  // champ de vision (sensation d'accélération très marquée).
  const fovCible = 60 + (voiture.tempsBoost > 0 ? 15 : 0);
  camera.fov += (fovCible - camera.fov) * 0.1;
  camera.updateProjectionMatrix();
}

/* ---------- COMPTEUR FPS (bas à gauche) ----------
   Moyenne glissante sur ~500 ms pour un chiffre stable.
   Affiche aussi le nombre de draw calls (renderer.info),
   utile pour comprendre d'où viennent les ralentissements. */
const fpsElt = document.getElementById('fps');
let fpsFrames = 0;
let fpsDerniereMesure = performance.now();

function mesurerFPS() {
  fpsFrames++;
  const maintenant = performance.now();
  if (maintenant - fpsDerniereMesure >= 500) {
    const fps = Math.round((fpsFrames * 1000) / (maintenant - fpsDerniereMesure));
    const drawCalls = renderer.info.render.calls;
    fpsElt.textContent = fps + ' FPS | ' + drawCalls + ' draws';
    fpsFrames = 0;
    fpsDerniereMesure = maintenant;
  }
}

function animer() {
  requestAnimationFrame(animer);
  uniformTemps.value = performance.now() / 1000; // pilote l'ondulation de l'herbe
  if (!enPause) update(); // en pause : la scène se fige
  // Dérive lente des nuages, avec rebouclage une fois hors zone
  for (const n of nuages) {
    n.position.x += VITESSE_NUAGE;
    if (n.position.x > 300) n.position.x = -300;
  }
  // Le skydome suit la caméra : le dégradé reste stable
  skydome.position.copy(camera.position);
  renderer.render(scene, camera);
  mesurerFPS();
}
animer();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
