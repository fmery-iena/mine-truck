/* ================= 1. CONFIG ================= */

/* ================= 3. LUMIÈRES (éclairage venant du haut) ================= */

const rimD = new THREE.SpotLight(0xfff1de, 300, 0, 0.7, 0.8, 1.6);

// Remplissage doux frontal + ambiance minimale

/* ================= 4. SOL MIROIR (style garage Gran Turismo) ================= */
const sol = new Reflector(new THREE.CircleGeometry(28, 72), {
  clipBias: 0.003,

// Ombre de contact douce sous la voiture
function textureOmbre() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const ombre = new THREE.Mesh(
  new THREE.PlaneGeometry(5.6, 3.0),
  new THREE.MeshBasicMaterial({ map: textureOmbre(), transparent: true, depthWrite: false })
);
ombre.rotation.x = -Math.PI / 2;
ombre.position.y = 0.005;
scene.add(ombre);

/* ================= 5. MATÉRIAUX ================= */
const peinture = new THREE.MeshPhysicalMaterial({
  color: CONFIG.couleurCarrosserie,
  metalness: 0.25,
  roughness: 0.30,
  clearcoat: 1.0,           // vernis

  envMapIntensity: 1.0,
});
const vitre = new THREE.MeshPhysicalMaterial({

});
const noirMat = new THREE.MeshStandardMaterial({ color: 0x060607, roughness: 0.55, metalness: 0.4 });
const noirBrillant = new THREE.MeshPhysicalMaterial({
  color: 0x050506, roughness: 0.08, metalness: 0.6, clearcoat: 1.0, clearcoatRoughness: 0.05,
});

const jante = new THREE.MeshStandardMaterial({ color: 0xb9bec7, metalness: 1.0, roughness: 0.28 });
const pneuMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.95, metalness: 0.0 });

/* ================= 6. CARROSSERIE EN « LOFT » (sections le long de la caisse) =================
   Chaque station = { x, wB, wS, wT, yB, yS, yT } :
   x = position longitudinale, w = demi-largeurs (bas / épaule / haut),
   y = hauteurs (bas de caisse / ligne de ceinture / dessus). */
const STATIONS_CAISSE = [
  { x: -2.345, wB: 0.001, wS: 0.001, wT: 0.001, yB: 0.55, yS: 0.55, yT: 0.55 }, // pointe AR
  { x: -2.320, wB: 0.55,  wS: 0.62,  wT: 0.55,  yB: 0.28, yS: 0.68, yT: 0.90 }, // pare-choc AR
  { x: -2.150, wB: 0.80,  wS: 0.86,  wT: 0.80,  yB: 0.16, yS: 0.78, yT: 0.99 }, // coffre
  { x: -1.750, wB: 0.88,  wS: 0.905, wT: 0.85,  yB: 0.14, yS: 0.84, yT: 1.07 }, // ailes AR / hayon
  { x: -1.300, wB: 0.90,  wS: 0.920, wT: 0.88,  yB: 0.13, yS: 0.86, yT: 1.11 }, // roues AR / portes AR
  { x: -0.600, wB: 0.905, wS: 0.925, wT: 0.90,  yB: 0.13, yS: 0.87, yT: 0.87 }, // pied milieu (caisse ouverte)
  { x: -0.100, wB: 0.905, wS: 0.925, wT: 0.90,  yB: 0.13, yS: 0.87, yT: 0.87 }, // montant de toit
  { x:  0.450, wB: 0.900, wS: 0.920, wT: 0.88,  yB: 0.13, yS: 0.86, yT: 0.86 }, // base pare-brise
  { x:  0.800, wB: 0.895, wS: 0.915, wT: 0.86,  yB: 0.13, yS: 0.84, yT: 1.11 }, // capot AR
  { x:  1.400, wB: 0.880, wS: 0.900, wT: 0.82,  yB: 0.14, yS: 0.80, yT: 1.03 }, // capot
  { x:  1.900, wB: 0.850, wS: 0.875, wT: 0.78,  yB: 0.16, yS: 0.76, yT: 0.95 }, // nez
  { x:  2.200, wB: 0.760, wS: 0.800, wT: 0.68,  yB: 0.22, yS: 0.70, yT: 0.88 }, // bout du nez
  { x:  2.345, wB: 0.001, wS: 0.001, wT: 0.001, yB: 0.55, yS: 0.55, yT: 0.55 }, // pointe AV
];

// Section transversale (y, z) d'une station de caisse.
// IMPORTANT : toujours le même nombre de points, même si le pavillon est
// ouvert (les points du haut sont alors posés sur la ligne de ceinture),
// sinon le loft mélange les sommets des stations entre elles.
function sectionCaisse(s) {
  const ouvert = s.yT <= s.yS + 0.02; // pavillon ouvert : la verrière recouvre
  const yT = ouvert ? s.yS : s.yT;
  const half = [
    [s.yB, 0], [s.yB, s.wB * 0.75], [s.yB + 0.03, s.wB],
    [s.yS - 0.12, s.wS * 0.995], [s.yS, s.wS],
    [s.yS + (yT - s.yS) * 0.45, s.wT + 0.03],
    [s.yS + (yT - s.yS) * 0.75, s.wT * 0.9],
    [ouvert ? s.yS - 0.04 : yT, 0],
  ];
  const pts = half.slice();
  for (let i = half.length - 2; i >= 1; i--) pts.push([half[i][0], -half[i][1]]);
  return pts;
}

// Construit un maillage fermé en balayant une section le long des stations
function loft(stations, sectionFn, materiau) {
  const sections = stations.map(sectionFn);
  const n = sections[0].length;
  for (const sec of sections) {
    if (sec.length !== n) throw new Error('loft : toutes les sections doivent avoir le même nombre de points');
  }
  const pos = [];
  for (const sec of sections) for (const [y, z] of sec) pos.push(0, y, z); // x rempli après
  const idx = [];
  for (let i = 0; i < stations.length - 1; i++) {
    for (let k = 0; k < n; k++) {
      const a = i * n + k, b = i * n + (k + 1) % n;
      const c = (i + 1) * n + (k + 1) % n, d = (i + 1) * n + k;
      idx.push(a, d, b, b, d, c);
    }
  }
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(pos);
  for (let i = 0; i < stations.length; i++) {
    for (let k = 0; k < n; k++) arr[(i * n + k) * 3] = stations[i].x;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, materiau);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const caisse = loft(STATIONS_CAISSE, sectionCaisse, peinture);
scene.add(caisse);

/* ================= 7. VERrière + TOIT ================= */
const STATIONS_VITRAGE = [
  { x:  0.55, wB: 0.78, wS: 0.80, wT: 0.55, yB: 0.84, yS: 1.05, yT: 1.36 }, // base pare-brise
  { x:  0.10, wB: 0.80, wS: 0.83, wT: 0.60, yB: 0.85, yS: 1.15, yT: 1.43 }, // pare-brise
  { x: -0.45, wB: 0.81, wS: 0.84, wT: 0.62, yB: 0.86, yS: 1.20, yT: 1.465 }, // toit
  { x: -1.00, wB: 0.80, wS: 0.82, wT: 0.58, yB: 0.86, yS: 1.15, yT: 1.40 }, // toit AR
  { x: -1.50, wB: 0.76, wS: 0.78, wT: 0.50, yB: 0.85, yS: 1.05, yT: 1.22 }, // lunette AR
  { x: -1.85, wB: 0.66, wS: 0.68, wT: 0.38, yB: 0.84, yS: 0.98, yT: 1.05 }, // fin de lunette
];
function sectionVitre(s) {
  const half = [
    [s.yB - 0.02, 0], [s.yB - 0.02, s.wB * 0.8], [s.yB + 0.06, s.wB],
    [s.yS - 0.08, s.wS], [s.yS + (s.yT - s.yS) * 0.55, s.wT], [s.yT, 0],
  ];
  const pts = half.slice();
  for (let i = half.length - 2; i >= 1; i--) pts.push([half[i][0], -half[i][1]]);
  return pts;
}
scene.add(loft(STATIONS_VITRAGE, sectionVitre, vitre));

// Panneau de toit peint par-dessus la verrière
const STATIONS_TOIT = [
  { x:  0.35, w: 0.84, y: 1.425 }, { x:  0.00, w: 0.845, y: 1.45 },
  { x: -0.45, w: 0.85, y: 1.475 }, { x: -1.00, w: 0.845, y: 1.41 },
  { x: -1.50, w: 0.80, y: 1.24 }, { x: -1.62, w: 0.74, y: 1.16 },
];
function sectionToit(s) {
  return [
    [s.y, -s.w], [s.y + 0.012, -s.w * 0.55], [s.y + 0.022, 0],
    [s.y + 0.012, s.w * 0.55], [s.y, s.w],
  ];
}
scene.add(loft(STATIONS_TOIT, sectionToit, peinture));

/* ================= 8. DÉTAILS EXTÉRIEURS ================= */
const voiture = new THREE.Group();
scene.add(voiture);

// --- Calandre noire brillante + emblème 3 griffes Peugeot ---
const calandre = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.34, 1.15), noirBrillant);
calandre.position.set(2.315, 0.56, 0);
voiture.add(calandre);
const priseAir = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 1.35), noirMat);
priseAir.position.set(2.31, 0.30, 0);
voiture.add(priseAir);

function textureGriffes() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.strokeStyle = '#dfe3e8'; g.lineWidth = 9; g.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    g.beginPath();
    g.moveTo(64 + i * 26 - 8, 96);
    g.quadraticCurveTo(64 + i * 26, 60, 64 + i * 26 + 8, 28);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const emblem = new THREE.Mesh(
  new THREE.PlaneGeometry(0.17, 0.17),
  new THREE.MeshBasicMaterial({ map: textureGriffes(), transparent: true })
);
emblem.position.set(2.345, 0.60, 0);
emblem.rotation.y = Math.PI / 2;
voiture.add(emblem);

// --- Phares avant : 3 griffes LED verticales (signature Peugeot) ---
function phare(signe) {
  const g = new THREE.Group();
  const boitier = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.075, 0.36), noirBrillant);
  g.add(boitier);
  for (let i = -1; i <= 1; i++) {
    const griffe = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.13, 0.014), ledBlanc);
    griffe.position.set(0.045, 0, i * 0.10);
    g.add(griffe);
  }
  g.position.set(2.14, 0.80, signe * 0.66);
  g.rotation.y = -signe * 0.38;
  return g;
}
voiture.add(phare(1), phare(-1));

// --- Feux arrière : barrettes rouges à 3 griffes ---
function feuArriere(signe) {
  const g = new THREE.Group();
  const barre = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.34), ledRouge);
  g.add(barre);
  for (let i = -1; i <= 1; i++) {
    const griffe = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.10, 0.012), ledRouge);
    griffe.position.set(-0.03, 0, signe * 0 + i * 0.09);
    g.add(griffe);
  }
  g.position.set(-2.30, 0.86, signe * 0.58);
  g.rotation.y = signe * 0.30;
  return g;
}
voiture.add(feuArriere(1), feuArriere(-1));

// --- Plaques d'immatriculation (texture canvas) ---
function texturePlaque(txt) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 110;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f6f8'; g.fillRect(0, 0, 512, 110);
  g.fillStyle = '#123a8f'; g.fillRect(0, 0, 56, 110);
  g.fillStyle = '#fff'; g.font = 'bold 34px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('★', 28, 56);
  g.fillStyle = '#101418'; g.font = 'bold 58px monospace';
  g.fillText(txt, 290, 58);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function plaque(txt, x, y, ry) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(0.52, 0.11),
    new THREE.MeshStandardMaterial({ map: texturePlaque(txt), roughness: 0.4, metalness: 0.1 })
  );
  m.position.set(x, y, 0); m.rotation.y = ry;
  voiture.add(m);
}
plaque('AB-408-PEUGEOT', 2.345, 0.40, Math.PI / 2);
plaque('AB-408-PEUGEOT', -2.35, 0.48, -Math.PI / 2);

// --- Badge « 408 » sur le coffre ---
function textureBadge() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 80;
  const g = c.getContext('2d');
  g.fillStyle = '#e8eaee'; g.font = 'bold 56px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('408', 128, 42);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const badge = new THREE.Mesh(
  new THREE.PlaneGeometry(0.24, 0.075),
  new THREE.MeshBasicMaterial({ map: textureBadge(), transparent: true })
);
badge.position.set(-2.335, 0.90, 0);
badge.rotation.y = -Math.PI / 2;
voiture.add(badge);

// --- Rétroviseurs ---
function retro(signe) {
  const g = new THREE.Group();
  const coque = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.085, 0.11), peinture);
  const glace = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.09), vitre);
  glace.position.x = -0.09;
  g.add(coque, glace);
  g.position.set(0.60, 0.97, signe * 0.95);
  return g;
}
voiture.add(retro(1), retro(-1));

// --- Poignées de portes chromées ---
for (const [x, signe] of [[0.30, 1], [0.30, -1], [-0.85, 1], [-0.85, -1]]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.022, 0.035), chrome);
  p.position.set(x, 0.875, signe * 0.905);
  voiture.add(p);
}

// --- Sortie d'échappement chromée ---
const echappement = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 24), chrome);
echappement.rotation.z = Math.PI / 2;
echappement.position.set(-2.28, 0.22, -0.35);
voiture.add(echappement);

// --- Fond de caisse (évite de voir à travers sous la voiture) ---
const dessous = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.12, 1.55), noirMat);
dessous.position.y = 0.17;
voiture.add(dessous);

/* ================= 9. ROUES (pneu + jante à bâtons + frein) ================= */
function roue() {
  const g = new THREE.Group();
  // Pneu : profil tourné (lathe)
  const profil = [
    new THREE.Vector2(0.20, -0.105), new THREE.Vector2(0.295, -0.10),
    new THREE.Vector2(0.335, -0.055), new THREE.Vector2(0.335, 0.055),
    new THREE.Vector2(0.295, 0.10), new THREE.Vector2(0.20, 0.105),
  ];
  const pneu = new THREE.Mesh(new THREE.LatheGeometry(profil, 40), pneuMat);
  g.add(pneu);
  // Disque de frein + étrier
  const disque = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.03, 32), disqueFrein);
  disque.rotation.x = Math.PI / 2;
  g.add(disque);
  // Jante : tambour + 5 doubles bâtons + capuchon
  const tambour = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.16, 32), jante);
  tambour.rotation.x = Math.PI / 2;
  g.add(tambour);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    for (const off of [-0.028, 0.028]) {
      const baton = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.19, 0.05), jante);
      baton.position.set(Math.cos(a + off) * 0.105, Math.sin(a + off) * 0.105, 0.065);
      baton.rotation.z = a + off;
      g.add(baton);
    }
  }
  const capuchon = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.02, 24), chrome);
  capuchon.rotation.x = Math.PI / 2;
  capuchon.position.z = 0.085;
  g.add(capuchon);
  return g;
}
const RAYON_ROUE = 0.335, DEMI_EMPATTEMENT = 1.3935, VOIE = 0.80;
for (const x of [-DEMI_EMPATTEMENT, DEMI_EMPATTEMENT]) {
  for (const z of [-VOIE, VOIE]) {
    const r = roue();
    r.position.set(x, RAYON_ROUE, z);
    voiture.add(r);
    // Enjoliveur d'arche de roue
    const arche = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.028, 10, 28, Math.PI), noirMat);
    arche.position.set(x, RAYON_ROUE, z + (z > 0 ? 0.115 : -0.115));
    voiture.add(arche);
  }
}

/* ================= 10. HABITACLE (aperçu par les vitres) ================= */
const interieur = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.9 });
const siege = (x) => {
  const g = new THREE.Group();
  const assise = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.12, 0.5), interieur);
  assise.position.y = 0.42;
  const dossier = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.48), interieur);
  dossier.position.set(x < 0 ? -0.22 : -0.22, 0.72, 0);
  g.add(assise, dossier);
  g.position.set(x, 0, -0.32);
  return g;
};
voiture.add(siege(0.05), siege(-0.05));
const banquette = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 1.3), interieur);
banquette.position.set(-0.95, 0.62, 0);
voiture.add(banquette);
const tableau = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.16, 1.25), interieur);
tableau.position.set(0.42, 0.82, 0);
voiture.add(tableau);
const volant = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.02, 12, 32), interieur);
volant.position.set(0.72, 0.85, -0.32);
volant.rotation.x = -1.1;
voiture.add(volant);

/* ================= 11. CONTRÔLES : rotation auto + souris / tactile ================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;                 // pas de déplacement latéral
controls.minDistance = CONFIG.distanceMin;  // molette / pincement : zoom
controls.maxDistance = CONFIG.distanceMax;
controls.maxPolarAngle = 1.50;              // on ne descend pas sous le sol
controls.autoRotate = true;                 // pivote lentement sur elle-même
controls.autoRotateSpeed = CONFIG.rotationAuto;
// La rotation auto reprend quand l'utilisateur relâche la souris / le doigt
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.addEventListener('end',   () => { controls.autoRotate = true; });

/* ================= 12. BOUCLE D'ANIMATION + REDIMENSIONNEMENT ================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
